apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: forgejo
  title: Forgejo + Actions runner
  description: Self-hosted git forge with a registered Forgejo Actions runner. Jobs run in an isolated Docker-in-Docker daemon, never on the host's Docker.
  tier: app
  category: development
  homepage: https://forgejo.org
  source: https://codeberg.org/forgejo/forgejo
spec:
  version: 0.9.0
  compose: compose.yaml
  web: { service: forgejo, port: 3000 }   # also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/", "^/[^/]+/[^/]+\\.git/", "^/[^/]+/[^/]+/(info/lfs|git-upload-pack|git-receive-pack)", "^/\\.well-known/"] }
  images:
    - name: codeberg.org/forgejo/forgejo
      track: minor
    - name: code.forgejo.org/forgejo/runner
      track: minor
    - name: docker
      track: minor
    - name: postgres
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, sso: true }
  oidc: { redirect: "/user/oauth2/${OIDC_NAME}/callback" }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: SSH_PORT
      type: int
      title: Host port for git over SSH
      default: "2222"
      required: true
    - name: ADMIN_USER
      type: string
      title: Admin user name (you sign in with it)
      description: "Not admin, which Forgejo reserves. Created on first start, or on the next apply of an existing stack; renaming it later here creates another admin."
      default: forgeadmin
      required: true
      pattern: '^[A-Za-z0-9]([A-Za-z0-9._-]{0,38}[A-Za-z0-9])?$'
    - name: ADMIN_EMAIL
      type: email
      title: Admin e-mail
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password (at least 8 characters)
      description: "Kept encrypted in the fleet. The admin is created with it when that account doesn't exist yet; change the password later in Forgejo."
      required: true
    - name: RUNNER_LABELS
      type: string
      title: Actions runner labels, separated by commas (label:docker://image)
      default: "docker:docker://node:22-bookworm"
      required: true
      pattern: '^[A-Za-z0-9._-]+:docker://[A-Za-z0-9./:@_-]+(,[A-Za-z0-9._-]+:docker://[A-Za-z0-9./:@_-]+)*$'
    - name: MAIL_ENABLED
      type: bool
      title: Send mail (notifications, password resets)
      description: Through the fleet's mail settings, or the mail server set below.
      default: "false"
    - name: SMTP_SERVER
      type: string
      title: Mail server
      description: Empty uses the fleet's mail server. Set it, and set the fields below too, to use another one.
    - name: SMTP_PORT
      type: int
      title: Mail server port
      description: Empty uses the fleet's port, else 587.
    - name: MAIL_PROTOCOL
      type: enum
      title: Mail server encryption
      description: "Empty picks it from the port: 587 STARTTLS, 25 none, 465 and others TLS. Set it for a STARTTLS server on another port."
      options: [smtp+starttls, smtps, smtp]
    - name: SMTP_LOGIN
      type: string
      title: Mail login
      description: Empty uses the fleet's mail user.
    - name: SMTP_PASSWORD
      type: secret
      title: Mail password
      description: Empty uses the fleet's mail password.
    - name: SMTP_FROM_ADDRESS
      type: email
      title: Mail from address
      description: Empty uses the fleet's sender address.
    - name: RUNNER_CAPACITY
      type: int
      title: Actions jobs that run at once
      default: "1"
      required: true
    - name: OIDC_ISSUER
      type: url
      title: Identity provider (OpenID Connect issuer), for signing in
      description: "Leave empty to sign in as the stack's signOn setting says: through the fleet's provider, a custom one, or none. Setting it here, with the client ID and secret below, overrides that. For a provider set here, register a client with the redirect URL https://<domain>/user/oauth2/<name>/callback. The provider must be reachable when the stack is applied: Forgejo checks it then. People link it to their account; new accounts still need an admin, as registration stays off."
    - name: OIDC_NAME
      type: string
      title: Its name on the sign-in page
      default: SSO
      required: true
      pattern: '^[A-Za-z0-9._-]{1,40}$'
    - name: OIDC_CLIENT_ID
      type: string
      title: Identity provider client ID
      description: Empty uses the stack's sign-on.
    - name: OIDC_CLIENT_SECRET
      type: secret
      title: Identity provider client secret
      description: Empty uses the stack's sign-on.
  files:
    - { src: files/runner.yaml, dest: runner.yaml }
  generate:
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
    - { name: RUNNER_SECRET, kind: secret, length: 40, encoding: hex }
  volumes:
    - { name: data, backup: true }
    - { name: db, backup: true }
    - { name: runner, backup: false }
