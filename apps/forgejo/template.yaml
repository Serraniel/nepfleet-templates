apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: forgejo
  title: Forgejo + Actions runner
  description: Self-hosted git forge with a registered Forgejo Actions runner. Jobs run in an isolated Docker-in-Docker daemon, never on the host's Docker.
  tier: app
  category: development
  homepage: https://forgejo.org
  source: https://codeberg.org/forgejo/forgejo
spec:
  version: 0.6.0
  compose: compose.yaml
  web: { service: forgejo, port: 3000 }   # also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/", "^/[^/]+/[^/]+\\.git/", "^/[^/]+/[^/]+/(info/lfs|git-upload-pack|git-receive-pack)", "^/\\.well-known/"] }
  images:
    - name: codeberg.org/forgejo/forgejo
      track: minor
    - name: code.forgejo.org/forgejo/runner
      track: minor
    - name: docker
      track: minor
    - name: postgres
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: SSH_PORT
      type: int
      title: Host port for git over SSH
      default: "2222"
      required: true
    - name: RUNNER_LABELS
      type: string
      title: Actions runner labels, separated by commas (label:docker://image)
      default: "docker:docker://node:22-bookworm"
      required: true
      pattern: '^[A-Za-z0-9._-]+:docker://[A-Za-z0-9./:@_-]+(,[A-Za-z0-9._-]+:docker://[A-Za-z0-9./:@_-]+)*$'
    - name: MAIL_ENABLED
      type: bool
      title: Send mail (notifications, password resets)
      default: "false"
    - name: SMTP_SERVER
      type: string
      title: Mail server
    - name: SMTP_PORT
      type: int
      title: Mail server port (STARTTLS)
      default: "587"
    - name: SMTP_LOGIN
      type: string
      title: Mail login
    - name: SMTP_PASSWORD
      type: secret
      title: Mail password
    - name: SMTP_FROM_ADDRESS
      type: email
      title: Mail from address
    - name: RUNNER_CAPACITY
      type: int
      title: Actions jobs that run at once
      default: "1"
      required: true
    - name: OIDC_ISSUER
      type: url
      title: Identity provider (OpenID Connect issuer), for signing in
      description: "Pocket ID, Authelia and others. Register a client with the redirect URL https://<domain>/user/oauth2/<name>/callback. People link it to their account; new accounts still need an admin, as registration stays off. Leave empty for none."
    - name: OIDC_NAME
      type: string
      title: Its name on the sign-in page
      default: SSO
      required: true
      pattern: '^[A-Za-z0-9._-]{1,40}$'
    - name: OIDC_CLIENT_ID
      type: string
      title: Identity provider client ID
    - name: OIDC_CLIENT_SECRET
      type: secret
      title: Identity provider client secret
  files:
    - { src: files/runner.yaml, dest: runner.yaml }
  generate:
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
    - { name: RUNNER_SECRET, kind: secret, length: 40, encoding: hex }
  volumes:
    - { name: data, backup: true }
    - { name: db, backup: true }
    - { name: runner, backup: false }
