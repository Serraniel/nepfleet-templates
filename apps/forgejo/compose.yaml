x-forgejo-env: &forgejo-env
  USER_UID: "1000"
  USER_GID: "1000"
  # No weekly update check (DNS lookup at release.forgejo.org); updates come through NepFleet.
  FORGEJO__cron_0x2E_update_checker__ENABLED: "false"
  FORGEJO__database__DB_TYPE: postgres
  FORGEJO__database__HOST: db:5432
  FORGEJO__database__NAME: forgejo
  FORGEJO__database__USER: forgejo
  FORGEJO__database__PASSWD: ${DB_PASSWORD}
  FORGEJO__server__DOMAIN: ${DOMAIN}
  FORGEJO__server__ROOT_URL: ${NEPFLEET_URL}/
  FORGEJO__server__SSH_DOMAIN: ${DOMAIN}
  FORGEJO__server__SSH_PORT: ${SSH_PORT}
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__actions__ENABLED: "true"
  # Mail, for notifications and password resets; off until a server is given.
  FORGEJO__mailer__ENABLED: ${MAIL_ENABLED}
  FORGEJO__mailer__PROTOCOL: smtp+starttls
  FORGEJO__mailer__SMTP_ADDR: ${SMTP_SERVER}
  FORGEJO__mailer__SMTP_PORT: ${SMTP_PORT}
  FORGEJO__mailer__USER: ${SMTP_LOGIN}
  FORGEJO__mailer__PASSWD: ${SMTP_PASSWORD}
  FORGEJO__mailer__FROM: ${SMTP_FROM_ADDRESS}

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: unless-stopped
    environment: *forgejo-env
    ports:
      - "${SSH_PORT}:22"
    volumes:
      - data:/data
    networks: [ingress, default]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      start_period: 60s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      kuma.forgejo.http.name: Forgejo
      kuma.forgejo.http.parent_name: forgejo-stack
      kuma.forgejo-stack.group.name: Forgejo
      kuma.forgejo.http.url: ${NEPFLEET_URL}/api/healthz
      homepage.group: Development
      homepage.name: Forgejo
      homepage.icon: forgejo.svg
      homepage.href: ${NEPFLEET_URL}

  # Registers the runner's shared secret with Forgejo. Idempotent; exits.
  register-runner:
    image: codeberg.org/forgejo/forgejo:17
    restart: "no"
    user: "1000:1000"
    entrypoint: ["forgejo", "forgejo-cli", "actions", "register",
                 "--name", "default", "--secret", "${RUNNER_SECRET}",
                 "--labels", "${RUNNER_LABELS}"]
    environment: *forgejo-env
    volumes:
      - data:/data
    depends_on:
      forgejo: { condition: service_healthy }

  # Adds the identity provider as a sign-in option, or updates it. Exits.
  identity-provider:
    image: codeberg.org/forgejo/forgejo:17
    restart: "no"
    user: "1000:1000"
    entrypoint:
      - sh
      - -euc
      - |
        if [ -z "$$OIDC_ISSUER" ]; then echo "no identity provider set"; exit 0; fi
        set -- --name "$$OIDC_NAME" --provider openidConnect --key "$$OIDC_CLIENT_ID" --secret "$$OIDC_CLIENT_SECRET" \
          --auto-discover-url "$${OIDC_ISSUER%/}/.well-known/openid-configuration" --scopes "openid email profile"
        id="$$(forgejo admin auth list | awk -v n="$$OIDC_NAME" '$$2 == n { print $$1 }')"
        if [ -n "$$id" ]; then forgejo admin auth update-oauth --id "$$id" "$$@"; else forgejo admin auth add-oauth "$$@"; fi
        echo "identity provider $$OIDC_NAME set"
    environment:
      <<: *forgejo-env
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_NAME: ${OIDC_NAME}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - data:/data
    depends_on:
      forgejo: { condition: service_healthy }

  runner:
    image: code.forgejo.org/forgejo/runner:13
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DOCKER_HOST: tcp://dind:2375
      RUNNER_SECRET: ${RUNNER_SECRET}
    # The connection is declared in the config: its UUID is the secret's first 16
    # characters as bytes, and its token the whole secret (as Forgejo registered it).
    command:
      - sh
      - -euc
      - |
        hex="$$(printf %s "$$RUNNER_SECRET" | head -c 16 | od -An -tx1 | tr -d ' \n')"
        uuid="$$(echo "$$hex" | sed -E 's/^(.{8})(.{4})(.{4})(.{4})(.{12})$$/\1-\2-\3-\4-\5/')"
        umask 077
        sed -e "s/@UUID@/$$uuid/" -e "s/@TOKEN@/$$RUNNER_SECRET/" /etc/runner.yaml > /data/runner.yaml
        rm -f /data/.runner   # from create-runner-file, which this replaces
        exec forgejo-runner daemon --config /data/runner.yaml
    working_dir: /data
    volumes:
      - runner:/data
      - ./runner.yaml:/etc/runner.yaml:ro
    networks: [default, ci]
    depends_on:
      register-runner: { condition: service_completed_successfully }
      # Not needed by the runner: compose only accepts a one-shot that exits when
      # something waits for it.
      identity-provider: { condition: service_completed_successfully }
      dind: { condition: service_started }
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.forgejo-runner.docker.name: Forgejo Actions runner
      kuma.forgejo-runner.docker.docker_container: ${NEPFLEET_STACK}-runner-1
      kuma.forgejo-runner.docker.docker_host_name: nepfleet-docker
      kuma.forgejo-runner.docker.parent_name: forgejo-stack

  # Isolated daemon for CI jobs. Privileged, but holds nothing but job containers.
  dind:
    image: docker:29-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
    networks: [ci]
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.forgejo-dind.docker.name: Forgejo runner's Docker
      kuma.forgejo-dind.docker.docker_container: ${NEPFLEET_STACK}-dind-1
      kuma.forgejo-dind.docker.docker_host_name: nepfleet-docker
      kuma.forgejo-dind.docker.parent_name: forgejo-stack

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "forgejo"]
      interval: 10s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.forgejo-db.docker.name: Forgejo database
      kuma.forgejo-db.docker.docker_container: ${NEPFLEET_STACK}-db-1
      kuma.forgejo-db.docker.docker_host_name: nepfleet-docker
      kuma.forgejo-db.docker.parent_name: forgejo-stack

volumes:
  data:
  db:
  runner:

networks:
  default:
  ci: # not internal: jobs pull images and dependencies
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
