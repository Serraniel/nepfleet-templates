apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: bookstack
  title: BookStack
  description: Wiki and documentation, organised in shelves, books and pages. Sign in with the admin e-mail and password you choose here.
  tier: app
  category: documents
  homepage: https://www.bookstackapp.com
  source: https://github.com/BookStackApp/BookStack
spec:
  version: 0.5.0
  compose: compose.yaml
  web: { service: bookstack, port: 80 }   # also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/"] }
  images:
    - name: lscr.io/linuxserver/bookstack
      track: minor
    - name: mariadb
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ADMIN_EMAIL
      type: email
      title: Admin e-mail
      description: You sign in to BookStack with it. Taken on the first start only, where it replaces the default admin@admin.com; change it later in BookStack.
      required: true
    - name: ADMIN_NAME
      type: string
      title: Admin name
      description: The admin's display name. Taken on the first start only.
      default: Admin
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: "Kept encrypted in the fleet; at least 8 characters. Taken on the first start only, where it replaces the default password; change it later in BookStack."
      required: true
      pattern: "^.{8,}$"
  generate:
    # BookStack (Laravel) accepts a 32-character key; it encrypts stored secrets.
    - { name: APP_KEY, kind: secret, length: 32, encoding: alnum }
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
    - { name: DB_ROOT_PASSWORD, kind: secret, length: 32, encoding: alnum }
  volumes:
    - { name: config, backup: true }
    - { name: db, backup: true }
