services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:26.09.2
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ}
      APP_URL: https://${DOMAIN}
      APP_KEY: ${APP_KEY}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - config:/config
    networks: [ingress, default]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost/status"]
      interval: 15s
      start_period: 60s
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      kuma.bookstack.http.name: BookStack
      kuma.bookstack.http.url: https://${DOMAIN}/status
      homepage.group: Documents
      homepage.name: BookStack
      homepage.icon: bookstack.svg
      homepage.href: https://${DOMAIN}

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"   # minor upgrades run mariadb-upgrade on start
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      start_period: 30s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy

volumes:
  config:
  db:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
