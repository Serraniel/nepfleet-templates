services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    environment:
      JELLYFIN_PublishedServerUrl: ${NEPFLEET_URL}
    volumes:
      - config:/config
      - cache:/cache
      - ${MEDIA_PATH}:/media:ro
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8096}}"
      kuma.jellyfin.http.name: Jellyfin
      kuma.jellyfin.http.url: ${NEPFLEET_URL}/health
      homepage.group: Media
      homepage.name: Jellyfin
      homepage.icon: jellyfin.svg
      homepage.href: ${NEPFLEET_URL}

volumes:
  config:
  cache:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
