apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: jellyfin
  title: Jellyfin
  description: Media server. Mount your media read-only. Pick a GPU for hardware transcoding.
  tier: app
  category: media
  homepage: https://jellyfin.org
  source: https://github.com/jellyfin/jellyfin
spec:
  version: 0.4.0
  compose: compose.yaml
  web: { service: jellyfin, port: 8096 }   # also reachable on a LAN port (access mode port)
  botCheck: { supported: false }
  images:
    - name: jellyfin/jellyfin
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ADMIN_USER
      type: string
      title: Admin user
      description: Created before Jellyfin is first reachable, so its startup wizard is never open on the domain. Taken only on the first start; later changes go in Jellyfin's own settings.
      default: admin
      required: true
      pattern: '^[A-Za-z0-9._@-]+$'
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: "You sign in with it. Taken only on the first start (stacks whose wizard is already done keep their users); change it later in Jellyfin."
      required: true
    - name: MEDIA_PATH
      type: path
      title: Host folder with your media
      required: true
    - name: GPU
      type: gpu
      title: Hardware transcoding (VAAPI/QSV on Intel or AMD, NVENC on NVIDIA)
      default: none
  hardware:
    - { input: GPU, services: [jellyfin] }
  volumes:
    - { name: config, backup: true }
    - { name: cache, backup: false }
