services:
  # Sets the web UI login (user admin) and turns off crash reports to
  # crash.syncthing.net in the config before Syncthing starts,
  # on every start: changing GUI_PASSWORD changes the login. The password
  # goes in on stdin, never on a command line.
  # Runs as root (a new volume belongs to root) and hands the files to PUID.
  # It also hands DATA_PATH to PUID:PGID: Docker creates a missing bind
  # folder as root, and Syncthing (running as PUID) couldn't write there.
  # Only the top folder, never recursively: the folder may already hold the
  # user's files with owners and modes of their own, and a recursive chown on
  # every start would rewrite them (and take long on a big tree). Syncthing
  # only needs to create folders in the top one.
  set-login:
    image: syncthing/syncthing:2.1.7
    user: "0:0"
    environment:
      GUI_PASSWORD: ${GUI_PASSWORD}
      PUID: ${PUID}
      PGID: ${PGID}
    entrypoint: ["/bin/sh", "-c"]
    command: ['printf %s "$$GUI_PASSWORD" | syncthing generate --home /var/syncthing/config --gui-user admin --gui-password - && sed -i "s#<crashReportingEnabled>true</crashReportingEnabled>#<crashReportingEnabled>false</crashReportingEnabled>#" /var/syncthing/config/config.xml && chown -R "$$PUID:$$PGID" /var/syncthing/config && mkdir -p /data && chown "$$PUID:$$PGID" /data']
    volumes:
      - config:/var/syncthing/config
      - ${DATA_PATH}:/data
    network_mode: none

  syncthing:
    image: syncthing/syncthing:2.1.7
    restart: unless-stopped
    # The image's own health check (/rest/noauth/health) is used.
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${SYNC_PORT}:22000/tcp"   # device connections
      - "${SYNC_PORT}:22000/udp"   # QUIC
    volumes:
      - config:/var/syncthing/config
      - ${DATA_PATH}:/data
    networks: [ingress]
    depends_on:
      set-login: { condition: service_completed_successfully }
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent index database
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8384}}"
      kuma.syncthing.http.name: Syncthing
      kuma.syncthing.http.url: ${NEPFLEET_URL}/rest/noauth/health
      homepage.group: Files
      homepage.name: Syncthing
      homepage.description: File sync between devices
      homepage.icon: syncthing.svg
      homepage.href: ${NEPFLEET_URL}

volumes:
  config:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
