apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: n8n
  title: n8n
  description: Workflow automation with a visual editor, webhooks and hundreds of integrations.
  tier: app
  category: automation
  homepage: https://n8n.io
  source: https://github.com/n8n-io/n8n
spec:
  version: 1.0.0
  compose: compose.yaml
  botCheck: { service: n8n, port: 5678, allow: ["^/webhook/", "^/webhook-test/", "^/webhook-waiting/", "^/api/v1/"] }
  images:
    - name: n8nio/n8n
      track: minor
    - name: postgres
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain (also the base URL of webhooks)
      required: true
    - name: OWNER_EMAIL
      type: email
      title: Owner e-mail
      description: You sign in to n8n with it, as its owner.
      required: true
    - name: OWNER_PASSWORD
      type: secret
      title: Owner password
      description: "Kept encrypted in the fleet; n8n gets only its bcrypt hash, and takes it on every start, so a new one here replaces the old."
      required: true
  generate:
    # n8n takes the owner's password as a bcrypt hash (N8N_INSTANCE_OWNER_*).
    - { name: OWNER_PASSWORD_HASH, kind: bcrypt, from: OWNER_PASSWORD }
    # Encrypts the credentials n8n stores; losing it makes them unreadable.
    - { name: ENCRYPTION_KEY, kind: secret, length: 48, encoding: alnum }
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
  volumes:
    - { name: data, backup: true }
    - { name: db, backup: true }
  migrations:
    # n8n migrates its database forward on the first start and can't go back,
    # so a failed upgrade restores the snapshot.
    - from: ">=0.1.0 <1.0.0"
      to: 1.0.0
      description: "n8n 2.x → 3.x. Before you upgrade, open Settings → Migration Report in n8n and fix what it lists. Workflows with removed nodes (Function, Function Item, Item Lists, Cron, Interval, Read/Write Binary File, Read PDF, the legacy OpenAI node, AI Agent v1 and others) fail, and published ones stop triggering. Slack Trigger credentials need a signing secret. Changed defaults: unverified community nodes are off (N8N_UNVERIFIED_PACKAGES_ENABLED), Code node tasks time out after 60 seconds (N8N_RUNNERS_TASK_TIMEOUT), Chat Hub is off. The database is migrated on start; going back means restoring the backup."
      backup: required
      rollback: restore
      steps:
        - name: start n8n 3.x
          deploy: true
          wait: healthy
