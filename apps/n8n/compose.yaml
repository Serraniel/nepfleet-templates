services:
  n8n:
    image: n8nio/n8n:2.46.6
    restart: unless-stopped
    environment:
      N8N_HOST: ${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"          # behind Caddy: trust one X-Forwarded-For hop
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - data:/home/node/.n8n
    networks: [ingress, default]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5678/healthz"]
      interval: 15s
      start_period: 60s
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 5678}}"
      kuma.n8n.http.name: n8n
      kuma.n8n.http.url: https://${DOMAIN}/healthz
      homepage.group: Automation
      homepage.name: n8n
      homepage.icon: n8n.svg
      homepage.href: https://${DOMAIN}

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "n8n"]
      interval: 10s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy

volumes:
  data:
  db:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
