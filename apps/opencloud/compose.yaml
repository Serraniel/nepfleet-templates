services:
  opencloud:
    image: opencloudeu/opencloud:7.2.4
    restart: unless-stopped
    # init only writes a config on first start; later starts skip it.
    entrypoint: ["/bin/sh", "-c", "opencloud init || true; exec opencloud server"]
    environment:
      OC_URL: ${NEPFLEET_URL}
      OC_INSECURE: "false"
      FRONTEND_CHECK_FOR_UPDATES: "false"   # no update check from the web UI
      PROXY_TLS: "false"            # Caddy terminates TLS
      OC_LOG_LEVEL: warn
      IDM_ADMIN_PASSWORD: ${ADMIN_PASSWORD}   # initial admin password, first start only
      # Office documents in the browser, with Euro-Office: only when OFFICE_DOMAIN
      # is set (and the office profile runs its service).
      OC_ADD_RUN_SERVICES: ${OFFICE_DOMAIN:+collaboration}
      COLLABORATION_WOPI_SRC: ${NEPFLEET_URL}
      COLLABORATION_APP_NAME: Euro-Office
      COLLABORATION_APP_PRODUCT: OnlyOffice
      COLLABORATION_APP_ADDR: https://${OFFICE_DOMAIN}
      COLLABORATION_APP_ICON: https://${OFFICE_DOMAIN}/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      COLLABORATION_APP_INSECURE: "false"
      COLLABORATION_CS3API_DATAGATEWAY_INSECURE: "false"
      COLLABORATION_APP_PROOF_DISABLE: "true"
    volumes:
      - config:/etc/opencloud
      - data:/var/lib/opencloud
      - ./app-registry.yaml:/etc/opencloud/app-registry.yaml:ro
    networks: [ingress]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9200}}"
      kuma.opencloud.http.name: OpenCloud
      kuma.opencloud.http.url: ${NEPFLEET_URL}
      homepage.group: Files
      homepage.name: OpenCloud
      homepage.icon: opencloud.svg
      homepage.href: ${NEPFLEET_URL}

  # Opens and edits Office documents in the browser. Big, so only with the office
  # profile. No extra privileges, unlike Collabora.
  euro-office:
    image: ghcr.io/euro-office/documentserver:v9.3.7
    profiles: [office]
    restart: unless-stopped
    environment:
      WOPI_ENABLED: "true"
      USE_UNAUTHORIZED_STORAGE: "false"
      JWT_SECRET: ${OFFICE_JWT_SECRET}
    networks: [ingress]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /hosting/discovery HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      caddy: ${OFFICE_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"

volumes:
  config:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
