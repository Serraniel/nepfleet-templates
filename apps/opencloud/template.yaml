apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: opencloud
  title: OpenCloud
  description: File sync and share (stable channel).
  tier: app
  category: files
  homepage: https://opencloud.eu
  source: https://github.com/opencloud-eu/opencloud
spec:
  version: 1.0.0
  compose: compose.yaml
  images:
    - name: opencloudeu/opencloud
      track: minor
    - name: ghcr.io/euro-office/documentserver
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  botCheck: { service: opencloud, port: 9200, allow: ["^/remote\\.php/", "^/dav/", "^/ocs/", "^/graph/", "^/status\\.php$", "^/\\.well-known/", "^/konnect/", "^/wopi/"] }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: COMPOSE_PROFILES
      type: enum
      title: Extra services (office adds Euro-Office, and needs the office domain too)
      options: ["none", "office"]
      default: "none"
    - name: OFFICE_DOMAIN
      type: hostname
      title: Domain for editing Office documents (Euro-Office); empty for none
      description: "Where the browser opens the editor. With the office profile, Euro-Office runs here (the profile refuses to start without it); with the profile at none, OpenCloud uses a WOPI document server you run elsewhere at this domain."
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: "You sign in as admin with it. Kept encrypted in the fleet. OpenCloud takes it on its first start; change it later in OpenCloud."
      required: true
  generate:
    - { name: OFFICE_JWT_SECRET, kind: secret, length: 48, encoding: alnum }
  files:
    - { src: files/app-registry.yaml, dest: app-registry.yaml }
    - { src: files/csp.yaml, dest: csp.yaml }
  volumes:
    - { name: config, backup: true }
    - { name: data, backup: true }
  migrations:
    # OpenCloud 8 moved search to a new, versioned index: until it is rebuilt,
    # files from before the upgrade are not found. The rebuild needs the new
    # server running, so it runs after the deploy, retrying until the search
    # service answers. It doesn't fail the migration: a rollback would start 7.2
    # on data 9.1 has already used, which upstream supports only from a backup.
    - from: ">=0.1.0 <1.0.0"
      to: 1.0.0
      description: "OpenCloud 7.2 → 9.1. Search moves to a new index, which this migration rebuilds after the upgrade; on many files that takes a while and search stays incomplete until it is done. If old files are still not found afterwards, run docker exec <stack>-opencloud-1 opencloud search index --all-spaces --force-rescan. Once search works, the old index at /var/lib/opencloud/search/bleve and the old preview cache at /var/lib/opencloud/thumbnails/files can be deleted. Guest links (new in 9) stay off."
      backup: recommended
      rollback: revert
      steps:
        - name: switch to OpenCloud 9.1
          deploy: true
        - name: rebuild the search index
          service: opencloud
          run: [sh, -c, "for i in $(seq 60); do opencloud search index --all-spaces --force-rescan && exit 0; sleep 5; done; echo 'search index not rebuilt: run opencloud search index --all-spaces --force-rescan' >&2"]
