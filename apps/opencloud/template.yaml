apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: opencloud
  title: OpenCloud
  description: File sync and share (stable channel).
  tier: app
  category: files
  homepage: https://opencloud.eu
  source: https://github.com/opencloud-eu/opencloud
spec:
  version: 0.3.0
  compose: compose.yaml
  images:
    - name: opencloudeu/opencloud
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  botCheck: { service: opencloud, port: 9200, allow: ["^/remote\\.php/", "^/dav/", "^/ocs/", "^/graph/", "^/status\\.php$", "^/\\.well-known/", "^/konnect/"] }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
  generate:
    - { name: ADMIN_PASSWORD, kind: secret, length: 24, encoding: alnum }
  volumes:
    - { name: config, backup: true }
    - { name: data, backup: true }
