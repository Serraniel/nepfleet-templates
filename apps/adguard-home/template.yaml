apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: adguard-home
  title: AdGuard Home
  description: "DNS ad and tracker blocking for the whole local network, and local DNS records. Finish its setup right after installing, as the first visitor creates the admin. In that wizard, set the web interface to port 3000, or NepFleet can't reach it afterwards. Then point your router's DNS at this host."
  tier: app
  category: networking
  homepage: https://adguard.com/adguard-home
  source: https://github.com/AdguardTeam/AdGuardHome
spec:
  version: 0.1.0
  compose: compose.yaml
  web: { service: adguard-home, port: 3000 }
  images:
    - name: adguard/adguardhome
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain of the web UI
      required: true
    - name: BIND_ADDR
      type: string
      title: Address DNS listens on (0.0.0.0 = all; this host's LAN IP if systemd-resolved holds port 53)
      default: "0.0.0.0"
      required: true
      pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    - name: DNS_PORT
      type: int
      title: DNS port (53 for devices to use it)
      default: "53"
      required: true
  volumes:
    - { name: conf, backup: true }   # settings, block lists, custom DNS entries
    - { name: work, backup: false, snapshot: false }   # query logs, statistics, downloaded lists
