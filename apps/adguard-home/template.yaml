apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: adguard-home
  title: AdGuard Home
  description: "DNS ad and tracker blocking for the whole local network, and local DNS records. It starts set up, with the admin from the stack's inputs, so no setup wizard is offered. Point your router's DNS at this host. For trusted names at home, add a DNS rewrite under Filters: *.home.example.org (Caddy's wildcard domain) to the server's LAN address. Only patch releases are applied by themselves: AdGuard Home's minor releases may break things, so NepFleet only reports them and you apply them by hand."
  tier: app
  category: networking
  homepage: https://adguard.com/adguard-home
  source: https://github.com/AdguardTeam/AdGuardHome
spec:
  version: 0.3.0
  compose: compose.yaml
  web: { service: adguard-home, port: 3000 }
  botCheck: { allow: ["^/dns-query", "^/control/"] }
  images:
    - name: adguard/adguardhome
      track: patch   # upstream: minor releases may be backward-incompatible
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain of the web UI
      required: true
    - name: BIND_ADDR
      type: string
      title: Address DNS listens on (0.0.0.0 = all; this host's LAN IP if systemd-resolved holds port 53)
      default: "0.0.0.0"
      required: true
      pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    - name: DNS_PORT
      type: int
      title: DNS port (53 for devices to use it)
      default: "53"
      required: true
    - name: ADMIN_USER
      type: string
      title: Admin user name
      description: Used only on the first start. Later, change it in AdGuard Home's settings file.
      default: admin
      required: true
      pattern: '^[A-Za-z0-9._@-]+$'
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: You sign in to the web UI with it. Used only on the first start; stacks set up through the old wizard keep the admin they have.
      required: true
  generate:
    - { name: ADMIN_PASSWORD_HASH, kind: bcrypt, from: ADMIN_PASSWORD }
  files:
    - { src: files/AdGuardHome.yaml, dest: seed/AdGuardHome.yaml }
  volumes:
    - { name: conf, backup: true }   # settings, block lists, custom DNS entries
    - { name: work, backup: false, snapshot: false }   # query logs, statistics, downloaded lists
