services:
  adguard-home:
    image: adguard/adguardhome:v1.0.0
    restart: unless-stopped
    ports:
      - "${BIND_ADDR}:${DNS_PORT}:53/udp"
      - "${BIND_ADDR}:${DNS_PORT}:53/tcp"
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf
    networks: [ingress]
    depends_on:
      seed: { condition: service_completed_successfully }
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      kuma.adguard-home.http.name: AdGuard Home
      kuma.adguard-home.http.url: ${NEPFLEET_URL}/
      homepage.group: Infrastructure
      homepage.name: AdGuard Home
      homepage.description: DNS ad and tracker blocking
      homepage.icon: adguard-home.svg
      homepage.href: ${NEPFLEET_URL}

  # Puts the first configuration (web UI on 3000, the admin from the inputs)
  # into the conf volume when it has none, so the setup wizard never opens on
  # the public domain. A config already there, edited in the UI or made by the
  # wizard on older installs, stays as it is.
  seed:
    image: adguard/adguardhome:v1.0.0
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["test -f /opt/adguardhome/conf/AdGuardHome.yaml || cp /seed/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml"]
    volumes:
      - conf:/opt/adguardhome/conf
      - ./seed:/seed:ro
    network_mode: none

volumes:
  work:
  conf:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
