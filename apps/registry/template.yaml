apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: registry
  title: Container registry
  description: Private OCI registry (CNCF Distribution) with htpasswd authentication.
  tier: app
  category: development
  homepage: https://distribution.github.io/distribution/
  source: https://github.com/distribution/distribution
spec:
  version: 0.3.1
  compose: compose.yaml
  botCheck: { service: registry, port: 5000, supported: false }   # an API, no web page
  images:
    - name: registry
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, logs: true, autoUpdate: true, backup: true, metrics: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: HTPASSWD
      type: secret
      title: htpasswd line(s)
      description: bcrypt only, e.g. the output of `htpasswd -nB alice`.
      pattern: '^[^:\s]+:\$2[aby]\$'
      required: true
  generate:
    - { name: HTTP_SECRET, kind: secret, length: 32, encoding: alnum }
  volumes:
    - { name: data, backup: true, shared: true }
