services:
  metube:
    image: ghcr.io/alexta69/metube:2026.11.01
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /downloads/.metube
    volumes:
      - ${DOWNLOAD_PATH}:/downloads
    networks: [ingress]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8081}}"
      kuma.metube.http.name: MeTube
      kuma.metube.http.url: https://${DOMAIN}
      homepage.group: Media
      homepage.name: MeTube
      homepage.icon: metube.svg
      homepage.href: https://${DOMAIN}

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
