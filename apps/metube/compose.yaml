services:
  metube:
    image: ghcr.io/alexta69/metube:2026.11.22
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /downloads/.metube
    volumes:
      - ${DOWNLOAD_PATH}:/downloads
    networks: [ingress]
    # MeTube has no login of its own: Caddy asks for the stack's user and
    # password (basic auth) on every path but /robots.txt, which the monitor
    # checks. List form, so Compose fills in the user, which is part of a
    # label's key.
    labels:
      - "caddy=${DOMAIN}"
      - "caddy.@metube_login=not path /robots.txt"
      - "caddy.basic_auth=@metube_login"
      - "caddy.basic_auth.${METUBE_USER}=${METUBE_PASSWORD_HASH}"
      - "caddy.reverse_proxy={{upstreams 8081}}"
      - "kuma.metube.http.name=MeTube"
      - "kuma.metube.http.url=${NEPFLEET_URL}/robots.txt"
      - "homepage.group=Media"
      - "homepage.name=MeTube"
      - "homepage.description=Video downloads"
      - "homepage.icon=metube.svg"
      - "homepage.href=${NEPFLEET_URL}"

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
