services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    environment:
      DOMAIN: ${NEPFLEET_URL}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - data:/data
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      kuma.vaultwarden.http.name: Vaultwarden
      kuma.vaultwarden.http.url: ${NEPFLEET_URL}/alive
      homepage.group: Security
      homepage.name: Vaultwarden
      homepage.icon: vaultwarden.svg
      homepage.href: ${NEPFLEET_URL}
    deploy:
      replicas: 1   # SQLite: never more than one
      update_config: { order: stop-first }

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
