services:
  vaultwarden:
    image: vaultwarden/server:1.37.5
    restart: unless-stopped
    # Creates the owner's account on the first start (owner.sh), then runs
    # Vaultwarden as its image does.
    command: ["/bin/bash", "/nepfleet/owner.sh"]
    environment:
      DOMAIN: ${NEPFLEET_URL}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      OWNER_EMAIL: ${OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD}
      # Sign-in through the stack's sign-on, when it has one, next to the
      # master password login. An account with the same (verified) email is
      # linked; others can create one through the provider. The vault still
      # needs its master password to unlock.
      SSO_ENABLED: ${NEPFLEET_OIDC_ENABLED}
      SSO_AUTHORITY: ${NEPFLEET_OIDC_ISSUER}
      SSO_CLIENT_ID: ${NEPFLEET_OIDC_CLIENT_ID}
      SSO_CLIENT_SECRET: ${NEPFLEET_OIDC_CLIENT_SECRET}
    volumes:
      - data:/data
      - ./owner.sh:/nepfleet/owner.sh:ro
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      kuma.vaultwarden.http.name: Vaultwarden
      kuma.vaultwarden.http.url: ${NEPFLEET_URL}/alive
      homepage.group: Security
      homepage.name: Vaultwarden
      homepage.description: Passwords
      homepage.icon: vaultwarden.svg
      homepage.href: ${NEPFLEET_URL}
    deploy:
      replicas: 1   # SQLite: never more than one
      update_config: { order: stop-first }

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
