apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: vaultwarden
  title: Vaultwarden
  description: Bitwarden-compatible password manager.
  tier: app
  category: security
  homepage: https://github.com/dani-garcia/vaultwarden
spec:
  version: 0.5.0
  compose: compose.yaml
  images:
    - name: vaultwarden/server
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, sso: true }
  oidc: { redirect: /identity/connect/oidc-signin }
  botCheck: { service: vaultwarden, port: 80, allow: ["^/api/", "^/identity/", "^/notifications/", "^/icons/", "^/alive$", "^/\\.well-known/"] }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: OWNER_EMAIL
      type: email
      title: Your e-mail (you sign in with it)
      description: "Your account is created with it on the first start, or on the next apply of an existing stack (nothing changes when it exists). Changing it here later does nothing; change it in Vaultwarden."
      required: true
    - name: OWNER_PASSWORD
      type: secret
      title: Your master password (at least 12 characters)
      description: "Kept encrypted in the fleet, and used once: to create your account. It unlocks your vault and can't be recovered, so don't lose it; change it later in Vaultwarden. Invite others from an organization in your vault: an invited e-mail can then create its account."
      required: true
      pattern: "^.{12,}$"
    - name: SIGNUPS_ALLOWED
      type: bool
      title: Allow anyone to sign up
      default: "false"
    - name: ADMIN_TOKEN
      type: secret
      title: Admin page token (Argon2 PHC string)
      description: Leave empty to disable /admin, which you don't need to use the vault or invite people. Generate with `docker run --rm -it vaultwarden/server /vaultwarden hash`; a plain token works too, but Vaultwarden warns about it.
  files:
    - { src: files/owner.sh, dest: owner.sh }
  volumes:
    - { name: data, backup: true, shared: true }
