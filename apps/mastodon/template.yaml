apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: mastodon
  title: Mastodon
  description: "Fediverse server. The domain becomes part of every account's name and can never change after the first start. Sign-ups need mail, so set SMTP. For push notifications, make keys with: docker compose exec web bundle exec rails mastodon:webpush:generate_vapid_key."
  tier: app
  category: social
  homepage: https://joinmastodon.org
  source: https://github.com/mastodon/mastodon
spec:
  version: 0.1.0
  compose: compose.yaml
  images:
    - name: ghcr.io/mastodon/mastodon
      track: minor
    - name: ghcr.io/mastodon/mastodon-streaming
      track: minor
    - name: postgres
      track: patch
    - name: redis
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain (can never change after the first start)
      required: true
    - name: SMTP_SERVER
      type: string
      title: Mail server
    - name: SMTP_PORT
      type: int
      title: Mail server port
      default: "587"
    - name: SMTP_LOGIN
      type: string
      title: Mail login
    - name: SMTP_PASSWORD
      type: secret
      title: Mail password
    - name: SMTP_FROM_ADDRESS
      type: email
      title: Mail from address
    - name: VAPID_PRIVATE_KEY
      type: secret
      title: Push notification private key
    - name: VAPID_PUBLIC_KEY
      type: string
      title: Push notification public key
  generate:
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
    - { name: SECRET_KEY_BASE, kind: secret, length: 128, encoding: hex }
    - { name: AR_PRIMARY_KEY, kind: secret, length: 48, encoding: alnum }
    - { name: AR_DETERMINISTIC_KEY, kind: secret, length: 48, encoding: alnum }
    - { name: AR_KEY_DERIVATION_SALT, kind: secret, length: 48, encoding: alnum }
  volumes:
    - { name: db, backup: true }
    - { name: media, backup: true }   # uploads and cached remote media; it can grow large
    - { name: redis, backup: false }
