apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: mastodon
  title: Mastodon
  description: "Fediverse server. The domain becomes part of every account's name and can never change after the first start. The owner account comes from the inputs and sign-ups start closed; to open them, it needs mail: the fleet's mail settings, or the stack's own. Push notification keys are made on the first start."
  tier: app
  category: social
  homepage: https://joinmastodon.org
  source: https://github.com/mastodon/mastodon
spec:
  version: 0.3.1
  compose: compose.yaml
  images:
    - name: ghcr.io/mastodon/mastodon
      track: minor
    - name: ghcr.io/mastodon/mastodon-streaming
      track: minor
    - name: postgres
      track: minor   # within the 18 tag; a new major needs a dump and restore
    - name: redis
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  botCheck: { service: web, port: 3000, allow: ["^/api/", "^/oauth/", "^/\\.well-known/", "^/nodeinfo", "^/inbox$", "^/users/[^/]+/(inbox|outbox|followers|following|collections)", "^/system/", "^/health$"] }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain (can never change after the first start)
      required: true
    - name: ADMIN_USER
      type: string
      title: Owner username
      description: The owner account, created before Mastodon first starts, so the instance never waits for someone to claim it. Letters, digits and underscores; not a name Mastodon reserves for staff, such as admin, owner or root. Sign in with its email. Taken only while the account does not exist.
      required: true
    - name: ADMIN_EMAIL
      type: email
      title: Owner email
      description: Sign in with this address. Taken only when the owner account is created; change it in Mastodon later.
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Owner password
      description: 8 to 72 characters. Taken only when the owner account is created; change it in Mastodon later.
      required: true
    - name: SMTP_SERVER
      type: string
      title: Mail server
      description: Empty uses the fleet's mail server. Set it, and set the fields below too, to use another one. Mastodon uses STARTTLS when the server offers it; a server that only takes TLS from the start (port 465) doesn't work.
    - name: SMTP_PORT
      type: int
      title: Mail server port
      description: Empty uses the fleet's port, else 587.
    - name: SMTP_LOGIN
      type: string
      title: Mail login
      description: Empty uses the fleet's mail user.
    - name: SMTP_PASSWORD
      type: secret
      title: Mail password
      description: Empty uses the fleet's mail password.
    - name: SMTP_FROM_ADDRESS
      type: email
      title: Mail from address
      description: Empty uses the fleet's sender address.
    - name: VAPID_PRIVATE_KEY
      type: secret
      title: Push notification private key
      description: Leave empty to use the key pair made on the first start. Changing keys stops push for browsers subscribed to the old ones.
    - name: VAPID_PUBLIC_KEY
      type: string
      title: Push notification public key
      description: Set together with the private key, or leave both empty.
  files:
    - { src: files/setup.rb, dest: setup/setup.rb }
  generate:
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
    - { name: SECRET_KEY_BASE, kind: secret, length: 128, encoding: hex }
    - { name: AR_PRIMARY_KEY, kind: secret, length: 48, encoding: alnum }
    - { name: AR_DETERMINISTIC_KEY, kind: secret, length: 48, encoding: alnum }
    - { name: AR_KEY_DERIVATION_SALT, kind: secret, length: 48, encoding: alnum }
  volumes:
    - { name: db, backup: true }
    - { name: media, backup: true }   # uploads and cached remote media; it can grow large
    - { name: redis, backup: false }
    - { name: vapid, backup: true }   # push notification keys; new keys would stop push for every subscribed browser
