x-mastodon: &mastodon
  LOCAL_DOMAIN: ${DOMAIN}
  RAILS_ENV: production
  NODE_ENV: production
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: mastodon
  DB_USER: mastodon
  DB_PASS: ${DB_PASSWORD}
  ES_ENABLED: "false"
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${AR_PRIMARY_KEY}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${AR_DETERMINISTIC_KEY}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_KEY_DERIVATION_SALT}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
  # Each mail field the stack leaves empty comes from the fleet's settings.
  SMTP_SERVER: ${SMTP_SERVER:-${NEPFLEET_SMTP_HOST}}
  SMTP_PORT: ${SMTP_PORT:-${NEPFLEET_SMTP_PORT:-587}}
  SMTP_LOGIN: ${SMTP_LOGIN:-${NEPFLEET_SMTP_USER}}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-${NEPFLEET_SMTP_PASSWORD}}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-${NEPFLEET_SMTP_FROM}}
  # TLS from the start (465) or STARTTLS. Mastodon reads "false" as never and
  # any other unknown value, such as "true", as auto.
  SMTP_TLS: ${SMTP_TLS:-${NEPFLEET_SMTP_IMPLICIT_TLS:-false}}
  SMTP_ENABLE_STARTTLS: ${SMTP_ENABLE_STARTTLS:-${NEPFLEET_SMTP_STARTTLS:-auto}}
  # Sign-in through the stack's sign-on, when it has one, next to the local
  # login. People get an account on their first sign-in. A local account,
  # such as the owner's, is not linked by email: sign in to it, then use the
  # provider once from the same browser to link it.
  OIDC_ENABLED: ${NEPFLEET_OIDC_ENABLED}
  OIDC_DISPLAY_NAME: SSO
  OIDC_DISCOVERY: "true"
  OIDC_ISSUER: ${NEPFLEET_OIDC_ISSUER}
  OIDC_CLIENT_ID: ${NEPFLEET_OIDC_CLIENT_ID}
  OIDC_CLIENT_SECRET: ${NEPFLEET_OIDC_CLIENT_SECRET}
  OIDC_SCOPE: openid,profile,email
  OIDC_UID_FIELD: sub
  OIDC_REDIRECT_URI: ${NEPFLEET_URL}/auth/auth/openid_connect/callback

services:
  # Sets up or upgrades the database, then ends. The web service waits for it.
  migrate:
    image: ghcr.io/mastodon/mastodon:v4.7.6
    restart: "no"
    environment: *mastodon
    command: bundle exec rails db:prepare
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Makes the push notification keys once and the owner account from the
  # stack's inputs, then ends (files/setup.rb). Web and sidekiq wait for it.
  # Root only to write the keys into the vapid volume; the file goes to the
  # mastodon user.
  setup:
    image: ghcr.io/mastodon/mastodon:v4.7.6
    restart: "no"
    user: "0"
    environment:
      <<: *mastodon
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: bundle exec rails runner /setup/setup.rb
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - vapid:/vapid
      - ./setup:/setup:ro

  # Web and sidekiq take the push notification keys from the vapid volume,
  # unless the stack's inputs give a key pair.
  web:
    image: ghcr.io/mastodon/mastodon:v4.7.6
    restart: unless-stopped
    environment: *mastodon
    command:
      - sh
      - -c
      - |
        if [ -z "$$VAPID_PRIVATE_KEY" ]; then set -a; . /vapid/vapid.env; set +a; fi
        exec bundle exec puma -C config/puma.rb
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - media:/mastodon/public/system
      - vapid:/vapid:ro
    networks: [default, ingress]
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:3000/health | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      kuma.mastodon.http.name: Mastodon
      kuma.mastodon.http.url: ${NEPFLEET_URL}/health
      homepage.group: Social
      homepage.name: Mastodon
      homepage.description: Social network
      homepage.icon: mastodon.svg
      homepage.href: ${NEPFLEET_URL}

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.7.6
    restart: unless-stopped
    environment: *mastodon
    command: node ./streaming/index.js
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [default, ingress]
    healthcheck:
      test: ["CMD-SHELL", "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q OK"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      caddy: ${DOMAIN}
      caddy.@streaming.path: /api/v1/streaming*
      caddy.reverse_proxy: "@streaming {{upstreams 4000}}"

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.7.6
    restart: unless-stopped
    environment: *mastodon
    command:
      - sh
      - -c
      - |
        if [ -z "$$VAPID_PRIVATE_KEY" ]; then set -a; . /vapid/vapid.env; set +a; fi
        exec bundle exec sidekiq
    depends_on:
      setup:
        condition: service_completed_successfully
    volumes:
      - media:/mastodon/public/system
      - vapid:/vapid:ro
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]idekiq 8' || false"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mastodon
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mastodon"]
      interval: 10s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

volumes:
  media:
  vapid:
  db:
  redis:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
