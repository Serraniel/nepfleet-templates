apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: tdarr-node
  title: Tdarr node
  description: "An extra Tdarr worker on another host, connecting to a Tdarr server's node port. Give it the server's key, in stack.yaml as API_KEY with from tdarr and secret API_KEY. It must see the media and the cache under the same paths as the server (/media and /temp in the container), for example through a network share mounted at the same host folders. Pick a GPU for hardware transcoding."
  tier: app
  category: media
  homepage: https://home.tdarr.io
  source: https://github.com/HaveAGitGat/Tdarr
spec:
  version: 0.1.0
  compose: compose.yaml
  images:
    - name: ghcr.io/haveagitgat/tdarr_node
      track: minor
  supports: { arm64: true, logs: true, autoUpdate: true }
  inputs:
    - name: SERVER_HOST
      type: hostname
      title: The Tdarr server's host
      description: The host or address where the tdarr stack runs.
      required: true
    - name: SERVER_PORT
      type: int
      title: The server's node port
      default: "8266"
      required: true
    - name: API_KEY
      type: secret
      title: The server's API key
      description: "Take it from the server's stack: API_KEY with from tdarr and secret API_KEY."
      required: true
    - name: MEDIA_PATH
      type: path
      title: Host folder with the media, as the server sees it
      required: true
    - name: CACHE_PATH
      type: path
      title: Host folder for the transcode cache, shared with the server
      default: /srv/tdarr-cache
      required: true
    - name: CPU_WORKERS
      type: int
      title: Transcodes on the CPU at a time
      default: "1"
      required: true
    - name: GPU_WORKERS
      type: int
      title: Transcodes on the GPU at a time
      description: Needs a GPU picked below.
      default: "0"
      required: true
    - name: PUID
      type: int
      title: User id owning the media
      default: "1000"
      required: true
    - name: PGID
      type: int
      title: Group id owning the media
      default: "1000"
      required: true
    - name: GPU
      type: gpu
      title: Hardware transcoding (VAAPI/QSV on Intel or AMD, NVENC on NVIDIA)
      default: none
  hardware:
    - { input: GPU, services: [node] }
  volumes:
    - { name: configs, backup: false }   # the node registers again on its own
    - { name: logs, backup: false }
