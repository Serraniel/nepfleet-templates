apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: openclaw
  title: OpenClaw
  description: "AI assistant gateway for messaging apps. It runs tools for whoever can message it, so think hard before connecting personal accounts, and consider egress mode enforce. Set it up with: docker compose exec openclaw node dist/index.js onboard. Not published on the network."
  tier: app
  category: ai
  homepage: https://openclaw.ai
  source: https://github.com/openclaw/openclaw
spec:
  version: 0.1.0
  compose: compose.yaml
  images:
    - name: ghcr.io/openclaw/openclaw
      track: minor
  supports: { logs: true, backup: true }
  generate:
    - { name: GATEWAY_TOKEN, kind: secret, length: 48, encoding: alnum }
  volumes:
    - { name: data, backup: true }   # configuration, credentials, sessions, workspace
