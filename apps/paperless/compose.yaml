services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4
    restart: unless-stopped
    environment:
      PAPERLESS_URL: ${NEPFLEET_URL}
      PAPERLESS_SECRET_KEY: ${SECRET_KEY}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${DB_PASSWORD}
      PAPERLESS_OCR_LANGUAGE: ${OCR_LANGUAGE}
      PAPERLESS_TIME_ZONE: ${TZ}
      # On when COMPOSE_PROFILES is office. Its services below start only then.
      PAPERLESS_TIKA_ENABLED: ${OFFICE_DOCUMENTS}
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ${CONSUME_PATH}:/usr/src/paperless/consume
    networks: [ingress, default]
    depends_on:
      db: { condition: service_healthy }
      broker: { condition: service_started }
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8000}}"
      kuma.paperless.http.name: Paperless
      kuma.paperless.http.parent_name: paperless-stack
      kuma.paperless-stack.group.name: Paperless
      kuma.paperless.http.url: ${NEPFLEET_URL}
      homepage.group: Documents
      homepage.name: Paperless
      homepage.icon: paperless-ngx.svg
      homepage.href: ${NEPFLEET_URL}

  # Read Office documents and turn them into PDFs. Sizable, so off unless asked for.
  tika:
    image: apache/tika:3.3.3.0
    profiles: [office]
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:9.3.0
    profiles: [office]
    restart: unless-stopped
    # Documents are untrusted: no JavaScript, and no reaching out while converting.
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]

  broker:
    image: valkey/valkey:9.2-alpine
    restart: unless-stopped
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.paperless-broker.docker.name: Paperless Redis
      kuma.paperless-broker.docker.docker_container: ${NEPFLEET_STACK}-broker-1
      kuma.paperless-broker.docker.docker_host_name: nepfleet-docker
      kuma.paperless-broker.docker.parent_name: paperless-stack

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperless"]
      interval: 10s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.paperless-db.docker.name: Paperless database
      kuma.paperless-db.docker.docker_container: ${NEPFLEET_STACK}-db-1
      kuma.paperless-db.docker.docker_host_name: nepfleet-docker
      kuma.paperless-db.docker.parent_name: paperless-stack

volumes:
  data:
  media:
  db:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
