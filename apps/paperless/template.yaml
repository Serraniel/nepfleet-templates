apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: paperless
  title: Paperless-ngx
  description: Document management with OCR.
  tier: app
  category: documents
  homepage: https://docs.paperless-ngx.com
  source: https://github.com/paperless-ngx/paperless-ngx
spec:
  version: 0.3.0
  compose: compose.yaml
  web: { service: paperless, port: 8000 }   # also reachable on a LAN port (access mode port)
  images:
    - name: ghcr.io/paperless-ngx/paperless-ngx
      track: minor
    - name: postgres
      track: minor
    - name: valkey/valkey
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: OCR_LANGUAGE
      type: string
      title: OCR languages (tesseract codes, "+" separated)
      default: deu+eng
      required: true
    - name: CONSUME_PATH
      type: path
      title: Host folder watched for new documents
      default: ./consume
      required: true
  generate:
    - { name: SECRET_KEY, kind: secret, length: 64, encoding: alnum }
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
  volumes:
    - { name: data, backup: true }
    - { name: media, backup: true }
    - { name: db, backup: true }
