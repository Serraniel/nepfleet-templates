apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: actual
  title: Actual Budget
  description: Local-first personal finance and envelope budgeting. Sign in with the server password from the stack's inputs.
  tier: app
  category: finance
  homepage: https://actualbudget.org
  source: https://github.com/actualbudget/actual
spec:
  version: 0.3.1
  compose: compose.yaml
  images:
    # Versions are YY.MM.patch: "minor" takes the monthly releases of a year.
    - name: actualbudget/actual-server
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: SERVER_PASSWORD
      type: secret
      title: Server password
      description: The password you sign in to Actual with, set before the domain opens so nobody else can claim the server. Taken on the first start only; a server that already has a password keeps it. Change it later in Actual's settings.
      required: true
  files:
    - { src: files/setup.mjs, dest: setup/setup.mjs }
  volumes:
    - { name: data, backup: true }
