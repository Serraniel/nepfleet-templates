services:
  actual:
    image: actualbudget/actual-server:26.11.0
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - data:/data
    networks: [ingress]
    healthcheck:
      test: ["CMD", "node", "src/scripts/health-check.js"]
      interval: 30s
      start_period: 20s
    depends_on:
      # The server password is set before the domain reaches Actual.
      setup: { condition: service_completed_successfully }
    labels:
      docker-volume-backup.stop-during-backup: "true"   # SQLite files: consistent copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 5006}}"
      kuma.actual.http.name: Actual Budget
      kuma.actual.http.url: ${NEPFLEET_URL}/health
      homepage.group: Finance
      homepage.name: Actual Budget
      homepage.description: Budgeting
      homepage.icon: actual-budget.svg
      homepage.href: ${NEPFLEET_URL}

  # Sets the server password from SERVER_PASSWORD on the first start
  # (setup.mjs runs Actual on loopback and calls its first-run API), then
  # exits; later runs find a password set and do nothing.
  setup:
    image: actualbudget/actual-server:26.11.0
    restart: "no"
    entrypoint: ["node", "/setup/setup.mjs"]
    environment:
      SERVER_PASSWORD: ${SERVER_PASSWORD}
    volumes:
      - data:/data
      - ./setup:/setup:ro

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
