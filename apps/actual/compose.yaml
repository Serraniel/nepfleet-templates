services:
  actual:
    image: actualbudget/actual-server:26.11.0
    restart: unless-stopped
    # setup.mjs first sets the server password from SERVER_PASSWORD (on the
    # first start only: it runs Actual privately on loopback and calls its
    # first-run API), then the server starts as usual. Doing it in the same
    # container means the "set a password" screen is never reachable, on
    # Swarm too, where nothing waits for a separate one-shot service.
    command: ["sh", "-c", "node /setup/setup.mjs && exec node app.js"]
    environment:
      TZ: ${TZ}
      SERVER_PASSWORD: ${SERVER_PASSWORD}
    volumes:
      - data:/data
      - ./setup:/setup:ro
    networks: [ingress]
    healthcheck:
      test: ["CMD", "node", "src/scripts/health-check.js"]
      interval: 30s
      start_period: 60s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # SQLite files: consistent copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 5006}}"
      kuma.actual.http.name: Actual Budget
      kuma.actual.http.url: ${NEPFLEET_URL}/health
      homepage.group: Finance
      homepage.name: Actual Budget
      homepage.description: Budgeting
      homepage.icon: actual-budget.svg
      homepage.href: ${NEPFLEET_URL}

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
