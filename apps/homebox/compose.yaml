services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.1
    restart: unless-stopped
    # On the first start (no database yet), a Homebox on localhost only, with
    # registration open, registers the admin from the inputs and stops; then
    # the real one starts, with registration as set. Later starts skip this.
    # The marker makes an interrupted first start try again.
    entrypoint:
      - sh
      - -euc
      - |
        if [ ! -e /data/homebox.db ] || [ -e /data/.nepfleet-admin-pending ]; then
          touch /data/.nepfleet-admin-pending
          HBOX_WEB_HOST=127.0.0.1 HBOX_WEB_PORT=7746 HBOX_OPTIONS_ALLOW_REGISTRATION=true /app/api /data/config.yml &
          pid=$$!
          i=0
          until wget -q -O /dev/null http://127.0.0.1:7746/api/v1/status; do
            i=$$((i + 1)); [ "$$i" -lt 120 ] || { echo "first start: Homebox did not come up"; exit 1; }
            sleep 1
          done
          esc() { printf %s "$$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          email="$$(esc "$$ADMIN_EMAIL")"; password="$$(esc "$$ADMIN_PASSWORD")"; name="$$(esc "$$ADMIN_NAME")"
          post() { printf %s "$$2" > /tmp/body; wget -q -O /dev/null --header "Content-Type: application/json" --post-file /tmp/body "http://127.0.0.1:7746/api/v1/users/$$1"; }
          login='{"username":"'"$$email"'","password":"'"$$password"'"}'
          if ! post login "$$login"; then
            post register '{"name":"'"$$name"'","email":"'"$$email"'","password":"'"$$password"'"}'
            post login "$$login"
          fi
          rm -f /tmp/body
          kill "$$pid"; wait "$$pid" || true
          rm -f /data/.nepfleet-admin-pending
          echo "first start: admin $$ADMIN_EMAIL registered"
        fi
        exec /app/api /data/config.yml
    environment:
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
      HBOX_LOG_LEVEL: info
      HBOX_OPTIONS_GITHUB_RELEASE_CHECK: "false"   # no release check against GitHub
      HBOX_WEB_MAX_UPLOAD_SIZE: "50"
      HBOX_OPTIONS_TRUST_PROXY: "true"   # behind Caddy
      HBOX_AUTH_API_KEY_PEPPER: ${API_KEY_PEPPER}
      # Sign-in through the stack's sign-on, when it has one. An account with
      # the same email, such as the admin, is linked; others get an account
      # (with an inventory of their own) on their first sign-in. Homebox asks
      # the provider once, at start: started without it, sign-on stays off
      # until the next restart.
      HBOX_OIDC_ENABLED: ${NEPFLEET_OIDC_ENABLED}
      HBOX_OIDC_ISSUER_URL: ${NEPFLEET_OIDC_ISSUER}
      HBOX_OIDC_CLIENT_ID: ${NEPFLEET_OIDC_CLIENT_ID}
      HBOX_OIDC_CLIENT_SECRET: ${NEPFLEET_OIDC_CLIENT_SECRET}
      HBOX_OIDC_VERIFY_EMAIL: "true"   # linking by email needs a verified one
      HBOX_OIDC_BUTTON_TEXT: Sign in with SSO
      HBOX_LABEL_MAKER_WIDTH: ${LABEL_WIDTH}
      HBOX_LABEL_MAKER_HEIGHT: ${LABEL_HEIGHT}
      HBOX_LABEL_MAKER_PADDING: ${LABEL_PADDING}
      HBOX_LABEL_MAKER_MARGIN: ${LABEL_MARGIN}
      HBOX_LABEL_MAKER_FONT_SIZE: ${LABEL_FONT_SIZE}
      HBOX_LABEL_MAKER_PRINT_COMMAND: ${LABEL_PRINT_COMMAND}
      TZ: ${TZ}
    volumes:
      - data:/data
      - labels:/labels
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 7745}}"
      kuma.homebox.http.name: Homebox
      kuma.homebox.http.url: ${NEPFLEET_URL}/api/v1/status
      homepage.group: Home
      homepage.name: Homebox
      homepage.description: Home inventory
      homepage.icon: homebox.svg
      homepage.href: ${NEPFLEET_URL}
    deploy:
      replicas: 1   # SQLite

volumes:
  data:
  labels:
    name: ${NEPFLEET_STACK}-labels

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
