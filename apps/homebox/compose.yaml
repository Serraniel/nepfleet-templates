services:
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.27.1
    restart: unless-stopped
    environment:
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
      HBOX_LOG_LEVEL: info
      HBOX_OPTIONS_GITHUB_RELEASE_CHECK: "false"   # no release check against GitHub
      HBOX_WEB_MAX_UPLOAD_SIZE: "50"
      HBOX_OPTIONS_TRUST_PROXY: "true"   # behind Caddy
      HBOX_AUTH_API_KEY_PEPPER: ${API_KEY_PEPPER}
      HBOX_LABEL_MAKER_WIDTH: ${LABEL_WIDTH}
      HBOX_LABEL_MAKER_HEIGHT: ${LABEL_HEIGHT}
      HBOX_LABEL_MAKER_PADDING: ${LABEL_PADDING}
      HBOX_LABEL_MAKER_MARGIN: ${LABEL_MARGIN}
      HBOX_LABEL_MAKER_FONT_SIZE: ${LABEL_FONT_SIZE}
      HBOX_LABEL_MAKER_PRINT_COMMAND: ${LABEL_PRINT_COMMAND}
      TZ: ${TZ}
    volumes:
      - data:/data
      - labels:/labels
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 7745}}"
      kuma.homebox.http.name: Homebox
      kuma.homebox.http.url: ${NEPFLEET_URL}/api/v1/status
      homepage.group: Home
      homepage.name: Homebox
      homepage.icon: homebox.svg
      homepage.href: ${NEPFLEET_URL}
    deploy:
      replicas: 1   # SQLite

volumes:
  data:
  labels:
    name: ${NEPFLEET_STACK}-labels

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
