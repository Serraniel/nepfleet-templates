apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: homebox
  title: Homebox
  description: Home inventory and organisation.
  tier: app
  category: home
  homepage: https://homebox.software
  source: https://github.com/sysadminsmedia/homebox
spec:
  version: 0.3.0
  compose: compose.yaml
  web: { service: homebox, port: 7745 }   # also reachable on a LAN port (access mode port)
  images:
    - name: ghcr.io/sysadminsmedia/homebox
      track: patch   # pre-1.0
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ALLOW_REGISTRATION
      type: bool
      title: Allow registration
      description: Needed to create the first account; turn off afterwards.
      default: "true"
    - name: LABEL_PRINT_COMMAND
      type: string
      title: Command that prints a label on the server
      description: "Runs in the container for Print on Server; empty turns that off (browser printing always works). Homebox passes the label image's file name, see its label maker documentation. Label images can go to /labels, the volume <stack>-labels, which other stacks can mount."
    - name: LABEL_WIDTH
      type: int
      title: Label width in pixels
      default: "526"
      required: true
    - name: LABEL_HEIGHT
      type: int
      title: Label height in pixels
      default: "200"
      required: true
    - name: LABEL_PADDING
      type: int
      title: Label padding in pixels
      default: "32"
      required: true
    - name: LABEL_MARGIN
      type: int
      title: Label margin in pixels
      default: "32"
      required: true
    - name: LABEL_FONT_SIZE
      type: int
      title: Label font size
      default: "32"
      required: true
  generate:
    # Required since Homebox 0.27; rotating it invalidates every API key.
    - { name: API_KEY_PEPPER, kind: secret, length: 64, encoding: alnum }
  volumes:
    - { name: data, backup: true }
    - { name: labels, backup: false }   # named <stack>-labels, for other stacks to mount
