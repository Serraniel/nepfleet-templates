apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: homebox
  title: Homebox
  description: Home inventory and organisation.
  tier: app
  category: home
  homepage: https://homebox.software
  source: https://github.com/sysadminsmedia/homebox
spec:
  version: 0.5.0
  compose: compose.yaml
  web: { service: homebox, port: 7745 }   # also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/"] }   # API clients and companion apps
  images:
    - name: ghcr.io/sysadminsmedia/homebox
      track: minor   # 0.x minors are its regular releases; migrations run on start
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, sso: true }
  oidc: { redirect: /api/v1/users/login/oidc/callback }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ADMIN_NAME
      type: string
      title: Admin name
      default: Admin
      required: true
    - name: ADMIN_EMAIL
      type: email
      title: Admin e-mail
      description: You sign in to Homebox with it. Homebox registers this account on its first start only; later changes here don't reach it (change it in Homebox).
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: "At least 6 characters. Taken on the first start only, when Homebox registers the admin; change it in Homebox afterwards."
      required: true
    - name: ALLOW_REGISTRATION
      type: bool
      title: Allow registration
      description: Lets anyone who reaches Homebox create an account. The admin is created without it; invite others from Homebox instead.
      default: "false"
    - name: LABEL_PRINT_COMMAND
      type: string
      title: Command that prints a label on the server
      description: "Runs in the container for Print on Server; empty turns that off (browser printing always works). Homebox passes the label image's file name, see its label maker documentation. Label images can go to /labels, the volume <stack>-labels, which other stacks can mount."
    - name: LABEL_WIDTH
      type: int
      title: Label width in pixels
      default: "526"
      required: true
    - name: LABEL_HEIGHT
      type: int
      title: Label height in pixels
      default: "200"
      required: true
    - name: LABEL_PADDING
      type: int
      title: Label padding in pixels
      default: "32"
      required: true
    - name: LABEL_MARGIN
      type: int
      title: Label margin in pixels
      default: "32"
      required: true
    - name: LABEL_FONT_SIZE
      type: int
      title: Label font size
      default: "32"
      required: true
  generate:
    # Required since Homebox 0.27; rotating it invalidates every API key.
    - { name: API_KEY_PEPPER, kind: secret, length: 64, encoding: alnum }
  volumes:
    - { name: data, backup: true }
    - { name: labels, backup: false }   # named <stack>-labels, for other stacks to mount
