services:
  synapse:
    image: matrixdotorg/synapse:v1.164.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
    # Creates the signing key on the first start only. It stays in the data volume,
    # and losing it breaks federation, so that volume is backed up.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -f /data/signing.key ] || python -m synapse.app.homeserver --config-path /config/homeserver.yaml --generate-keys
        chown -R 991:991 /data
        exec /start.py run
    volumes:
      - data:/data
      - ./config/homeserver.yaml:/config/homeserver.yaml:ro
    networks: [default, ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8008}}"
      kuma.matrix.http.name: Matrix
      kuma.matrix.http.url: ${NEPFLEET_URL}/health
      homepage.group: Communication
      homepage.name: Matrix
      homepage.icon: matrix.svg
      homepage.href: https://${ELEMENT_DOMAIN}

  element:
    image: vectorim/element-web:v1.12.33
    restart: unless-stopped
    volumes:
      - ./config/element.json:/app/config.json:ro
    networks: [ingress]
    labels:
      caddy: ${ELEMENT_DOMAIN}
      caddy.reverse_proxy: "{{upstreams 80}}"
      kuma.element.http.name: Element
      kuma.element.http.url: https://${ELEMENT_DOMAIN}

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Synapse refuses a database with any other collation.
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse"]
      interval: 10s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy

volumes:
  data:
  db:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
