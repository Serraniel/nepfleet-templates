apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: matrix
  title: Matrix
  description: "Chat with Synapse and the Element web client. Public registration is off: you sign in with the admin from the stack's inputs, who adds further users. With sign-on, people from the identity provider get an account on their first sign-in. The domain becomes part of every user's name and can't change later."
  tier: app
  category: communication
  homepage: https://matrix.org
  source: https://github.com/element-hq/synapse
spec:
  version: 0.3.0
  compose: compose.yaml
  botCheck: { service: synapse, port: 8008, allow: ["^/_matrix/", "^/_synapse/client/", "^/\\.well-known/matrix/"] }
  images:
    - name: matrixdotorg/synapse
      track: minor
    - name: vectorim/element-web
      track: minor
    - name: postgres
      track: minor
  supports: { swarm: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, arm64: true, sso: true }
  oidc: { redirect: /_synapse/client/oidc/callback }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Matrix domain, e.g. matrix.example.org
      required: true
    - name: ELEMENT_DOMAIN
      type: hostname
      title: Domain of the Element web client, e.g. chat.example.org
      required: true
    - name: ADMIN_USER
      type: string
      title: Admin user name (you sign in with it)
      description: "Becomes @name:your-matrix-domain. Registered on first start, or on the next apply of an existing stack; renaming it later here registers another admin."
      default: admin
      required: true
      pattern: '^[a-z0-9._=/-]{1,64}$'
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: "Kept encrypted in the fleet. The admin is registered with it when that user doesn't exist yet; change the password later in Element."
      required: true
  generate:
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
    - { name: REGISTRATION_SECRET, kind: secret, length: 48, encoding: alnum }
    - { name: MACAROON_SECRET, kind: secret, length: 48, encoding: alnum }
    - { name: FORM_SECRET, kind: secret, length: 48, encoding: alnum }
  files:
    - { src: files/homeserver.yaml, dest: config/homeserver.yaml }
    - { src: files/element.json, dest: config/element.json }
  volumes:
    - { name: data, backup: true }   # the signing key and media; media can grow large
    - { name: db, backup: true }
