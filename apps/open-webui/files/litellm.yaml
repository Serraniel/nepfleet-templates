# LiteLLM models, all exposed to Open WebUI as one OpenAI-compatible API.
# Docs: https://docs.litellm.ai/docs/proxy/configs
#
# Each provider whose API key is set in the stack's inputs is added from
# litellm-providers/ when LiteLLM starts: all of its models, as LiteLLM finds
# them with the provider's API (provider/<model>). A provider without a key
# isn't added at all, so it leaves no broken entries in Open WebUI.
model_list: []
# More models or runtimes, with their keys in the litellm service's environment:
#  - model_name: local-vllm
#    litellm_params: { model: openai/my-model, api_base: http://vllm:8000/v1 }
#  - model_name: llama-cpp
#    litellm_params: { model: openai/local, api_base: http://llama-cpp:8080/v1 }

litellm_settings:
  # List a provider's models from its API, with the key: the models the key
  # can use, rather than LiteLLM's built-in catalogue.
  check_provider_endpoint: true
