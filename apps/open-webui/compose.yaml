services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.4
    restart: unless-stopped
    environment:
      WEBUI_URL: ${NEPFLEET_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP}
      # The admin from the stack's inputs, made on the first start: the
      # domain never offers its first account to whoever comes first.
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Unused backends simply stay unreachable; Open WebUI shows them as offline.
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: sk-${LITELLM_KEY}
      # No telemetry (Scarf download analytics, ChromaDB usage data).
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"   # no release check against GitHub
    volumes:
      - webui:/app/backend/data
    networks: [ingress, default]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      kuma.open-webui.http.name: Open WebUI
      kuma.open-webui.http.parent_name: open-webui-stack
      kuma.open-webui-stack.group.name: Open WebUI
      kuma.open-webui.http.url: ${NEPFLEET_URL}/health
      homepage.group: AI
      homepage.name: Open WebUI
      homepage.description: Chat with language models
      homepage.icon: open-webui.svg
      homepage.href: ${NEPFLEET_URL}

  ollama:
    image: ollama/ollama:0.40.16
    profiles: [ollama]
    restart: unless-stopped
    # Serves, and once it answers pulls the models of OLLAMA_MODELS that it
    # doesn't have yet (in the background: apply doesn't wait for downloads).
    # Every start checks again, so models added to the input arrive with the
    # next apply; models already there are never fetched again.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & pid=$$!
        trap 'kill -TERM $$pid; wait $$pid; exit 0' TERM INT
        until ollama list >/dev/null 2>&1; do kill -0 $$pid 2>/dev/null || { wait $$pid; exit; }; sleep 1; done
        for m in $$(echo "$$MODELS" | tr ',' ' '); do
          if ollama show "$$m" >/dev/null 2>&1; then continue; fi
          echo "pulling $$m"
          if out=$$(ollama pull "$$m" 2>&1); then echo "pulled $$m"
          else echo "could not pull $$m: $$(echo "$$out" | tail -n 1)" >&2; fi
        done
        wait $$pid
    environment:
      MODELS: ${OLLAMA_MODELS}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # GPU: add `gpus: all` (NVIDIA) or the ROCm image with /dev/kfd and /dev/dri (AMD).
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.open-webui-ollama.docker.name: Open WebUI Ollama
      kuma.open-webui-ollama.docker.docker_container: ${NEPFLEET_STACK}-ollama-1
      kuma.open-webui-ollama.docker.docker_host_name: nepfleet-docker
      kuma.open-webui-ollama.docker.parent_name: open-webui-stack

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    profiles: [litellm]
    restart: unless-stopped
    # litellm.yaml, plus each provider of litellm-providers/ whose key is set:
    # LiteLLM would list a keyless provider/* route as a model that can't work.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        {
          echo "include:"
          echo "  - /config/litellm.yaml"
          if [ -n "$$OPENAI_API_KEY" ]; then echo "  - /config/providers/openai.yaml"; fi
          if [ -n "$$ANTHROPIC_API_KEY" ]; then echo "  - /config/providers/anthropic.yaml"; fi
        } > /tmp/config.yaml
        exec docker/prod_entrypoint.sh --config /tmp/config.yaml --port 4000
    environment:
      LITELLM_MASTER_KEY: sk-${LITELLM_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./litellm.yaml:/config/litellm.yaml:ro
      - ./litellm-providers:/config/providers:ro
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.open-webui-litellm.docker.name: Open WebUI LiteLLM
      kuma.open-webui-litellm.docker.docker_container: ${NEPFLEET_STACK}-litellm-1
      kuma.open-webui-litellm.docker.docker_host_name: nepfleet-docker
      kuma.open-webui-litellm.docker.parent_name: open-webui-stack

volumes:
  webui:
  ollama:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
