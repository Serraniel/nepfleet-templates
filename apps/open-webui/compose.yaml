services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    restart: unless-stopped
    environment:
      WEBUI_URL: ${NEPFLEET_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP}
      # Unused backends simply stay unreachable; Open WebUI shows them as offline.
      OLLAMA_BASE_URL: http://ollama:11434
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: sk-${LITELLM_KEY}
      # No telemetry (Scarf download analytics, ChromaDB usage data).
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"   # no release check against GitHub
    volumes:
      - webui:/app/backend/data
    networks: [ingress, default]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      kuma.open-webui.http.name: Open WebUI
      kuma.open-webui.http.parent_name: open-webui-stack
      kuma.open-webui-stack.group.name: Open WebUI
      kuma.open-webui.http.url: ${NEPFLEET_URL}/health
      homepage.group: AI
      homepage.name: Open WebUI
      homepage.icon: open-webui.svg
      homepage.href: ${NEPFLEET_URL}

  ollama:
    image: ollama/ollama:0.40.15
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # GPU: add `gpus: all` (NVIDIA) or the ROCm image with /dev/kfd and /dev/dri (AMD).
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.open-webui-ollama.docker.name: Open WebUI Ollama
      kuma.open-webui-ollama.docker.docker_container: ${NEPFLEET_STACK}-ollama-1
      kuma.open-webui-ollama.docker.docker_host_name: nepfleet-docker
      kuma.open-webui-ollama.docker.parent_name: open-webui-stack

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    profiles: [litellm]
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: sk-${LITELLM_KEY}
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    labels:
      # Running and healthy (Docker monitor; no credentials needed).
      kuma.open-webui-litellm.docker.name: Open WebUI LiteLLM
      kuma.open-webui-litellm.docker.docker_container: ${NEPFLEET_STACK}-litellm-1
      kuma.open-webui-litellm.docker.docker_host_name: nepfleet-docker
      kuma.open-webui-litellm.docker.parent_name: open-webui-stack

volumes:
  webui:
  ollama:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
