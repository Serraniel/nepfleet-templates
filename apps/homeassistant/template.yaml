apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: homeassistant
  title: Home Assistant
  description: Home automation. Runs on host networking for device discovery (mDNS, SSDP), and Caddy reaches it through host.docker.internal. Not for swarm.
  tier: app
  category: home
  homepage: https://www.home-assistant.io
  source: https://github.com/home-assistant/core
spec:
  version: 0.3.0
  compose: compose.yaml
  images:
    # year.month versioning: every month counts as a "minor"
    - name: ghcr.io/home-assistant/home-assistant
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ADMIN_NAME
      type: string
      title: Owner's display name
      default: Admin
      required: true
    - name: ADMIN_USER
      type: string
      title: Owner user name (you sign in with it)
      description: "Lowercase, no spaces. The owner is created on the first start, so the onboarding wizard is never open; a stack that is onboarded already keeps its users as they are. Change the password later in Home Assistant."
      default: admin
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Owner password
      description: Kept encrypted in the fleet. Taken only on the first start, to create the owner.
      required: true
    - name: ZIGBEE_DEVICE
      type: device
      title: Zigbee USB stick for ZHA (e.g. SkyConnect, Sonoff)
      description: Pick its /dev/serial/by-id path; Home Assistant sees the same path, so ZHA keeps working across reboots. After replugging the stick, restart the stack.
    - name: ZWAVE_DEVICE
      type: device
      title: Z-Wave USB stick
  hardware:
    - { input: ZIGBEE_DEVICE, services: [homeassistant] }
    - { input: ZWAVE_DEVICE, services: [homeassistant] }
  files:
    - { src: files/start.sh, dest: setup/start.sh }
    - { src: files/http_config.py, dest: setup/http_config.py }
    - { src: files/onboard.py, dest: setup/onboard.py }
  volumes:
    - { name: config, backup: true }
