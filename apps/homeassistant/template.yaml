apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: homeassistant
  title: Home Assistant
  description: Home automation. Runs on host networking for device discovery (mDNS, SSDP), and Caddy reaches it through host.docker.internal. Not for swarm.
  tier: app
  category: home
  homepage: https://www.home-assistant.io
  source: https://github.com/home-assistant/core
spec:
  version: 0.1.1
  compose: compose.yaml
  images:
    # year.month versioning: every month counts as a "minor"
    - name: ghcr.io/home-assistant/home-assistant
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ZIGBEE_DEVICE
      type: device
      title: Zigbee USB stick for ZHA (e.g. SkyConnect, Sonoff)
      description: Pick its /dev/serial/by-id path; Home Assistant sees the same path, so ZHA keeps working across reboots. After replugging the stick, restart the stack.
    - name: ZWAVE_DEVICE
      type: device
      title: Z-Wave USB stick
  hardware:
    - { input: ZIGBEE_DEVICE, services: [homeassistant] }
    - { input: ZWAVE_DEVICE, services: [homeassistant] }
  files:
    - { src: files/http.yaml, dest: config/http.yaml }
  volumes:
    - { name: config, backup: true }
