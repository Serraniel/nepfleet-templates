apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: immich
  title: Immich (+ Power Tools)
  description: Photo and video backup with machine learning. Immich Power Tools (bulk management, login with your Immich account) is an optional profile. Photos live in UPLOAD_PATH on the host; back that folder up with backrest (volume-backup covers the database).
  tier: app
  category: media
  homepage: https://immich.app
  source: https://github.com/immich-app/immich
spec:
  version: 0.6.0
  compose: compose.yaml
  web: { service: immich-server, port: 2283 }   # also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/", "^/\\.well-known/"] }
  images:
    # Server and machine learning must always run the same version:
    # Dependabot bumps them in one group (.github/dependabot.yml).
    - name: ghcr.io/immich-app/immich-server
      track: minor
    - name: ghcr.io/immich-app/immich-machine-learning
      track: minor
    - name: ghcr.io/immich-app/postgres
      track: patch   # extension versions move with Immich; follow the official compose file
    - name: valkey/valkey
      track: minor
    - name: ghcr.io/immich-power-tools/immich-power-tools
      track: patch   # pre-1.0
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, metrics: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain for Immich
      required: true
    - name: UPLOAD_PATH
      type: path
      title: Host folder for photos and videos
      required: true
    - name: ADMIN_EMAIL
      type: email
      title: Admin email
      description: Immich's admin, created on its first start so the "create admin account" page is never open to whoever finds the domain first. You sign in with this email. Only used while Immich has no admin; later changes go in Immich.
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: The admin's password, set on Immich's first start only; change it in Immich later.
      required: true
    - name: ADMIN_NAME
      type: string
      title: Admin name
      description: The admin's display name, set on Immich's first start only.
      default: Admin
    - name: COMPOSE_PROFILES
      type: enum
      title: Optional parts
      options: ["none", "power-tools"]
      default: "none"
    - name: POWER_TOOLS_DOMAIN
      type: hostname
      title: Domain for Power Tools
      default: tools.localhost
  generate:
    - { name: DB_PASSWORD, kind: secret, length: 32, encoding: alnum }
  files:
    - { src: files/setup.js, dest: setup/setup.js }
  volumes:
    - { name: db, backup: true }
    - { name: model-cache, backup: false }
    - { name: power-tools, backup: true }
