services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.30.0
    restart: unless-stopped
    # The image's own health check (healthcheck.sh) is used.
    environment:
      BASE_URL: ${NEPFLEET_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - data:/app/data
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # SQLite database: consistent copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9000}}"
      kuma.mealie.http.name: Mealie
      kuma.mealie.http.url: ${NEPFLEET_URL}/api/app/about
      homepage.group: Home
      homepage.name: Mealie
      homepage.icon: mealie.svg
      homepage.href: ${NEPFLEET_URL}

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
