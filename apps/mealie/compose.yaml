services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0
    restart: unless-stopped
    # Mealie creates its admin as changeme@example.com / MyPassword and has no
    # setting for it. setup.py runs next to Mealie, waits until it answers and,
    # while that login still works, changes the admin to ADMIN_EMAIL,
    # ADMIN_NAME and ADMIN_PASSWORD; later it finds the login refused and does
    # nothing. Mealie is healthy only once that is done (the image's own check,
    # plus the file setup.py leaves).
    entrypoint: ["/bin/sh", "-c", "/opt/mealie/bin/python /setup/setup.py & exec /app/run.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh && test -f /tmp/admin-set"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      BASE_URL: ${NEPFLEET_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Sign-in through the stack's sign-on, when it has one. Accounts are
      # matched by email, so the admin above signs in either way; others get
      # an account on their first sign-in. The provider must report the
      # email as verified.
      OIDC_AUTH_ENABLED: ${NEPFLEET_OIDC_ENABLED}
      OIDC_CONFIGURATION_URL: ${NEPFLEET_OIDC_ISSUER}/.well-known/openid-configuration
      OIDC_CLIENT_ID: ${NEPFLEET_OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${NEPFLEET_OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_NAME: SSO
    volumes:
      - data:/app/data
      - ./setup:/setup:ro
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # SQLite database: consistent copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9000}}"
      kuma.mealie.http.name: Mealie
      kuma.mealie.http.url: ${NEPFLEET_URL}/api/app/about
      homepage.group: Home
      homepage.name: Mealie
      homepage.description: Recipes and meal plans
      homepage.icon: mealie.svg
      homepage.href: ${NEPFLEET_URL}

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
