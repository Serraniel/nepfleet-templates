apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: mealie
  title: Mealie
  description: "Recipe manager and meal planner that imports recipes from any URL. Sign in with changeme@example.com / MyPassword on the first visit and change the email and password right away: until then anyone can log in as admin."
  tier: app
  category: home
  homepage: https://mealie.io
  source: https://github.com/mealie-recipes/mealie
spec:
  version: 0.1.0
  compose: compose.yaml
  images:
    - name: ghcr.io/mealie-recipes/mealie
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ALLOW_SIGNUP
      type: bool
      title: Let visitors create accounts
      default: "false"
  volumes:
    - { name: data, backup: true }
