apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: mealie
  title: Mealie
  description: Recipe manager and meal planner that imports recipes from any URL. Sign in as admin with the e-mail and password you set here.
  tier: app
  category: home
  homepage: https://mealie.io
  source: https://github.com/mealie-recipes/mealie
spec:
  version: 0.5.0
  compose: compose.yaml
  web: { service: mealie, port: 9000 }   # also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/"] }
  images:
    - name: ghcr.io/mealie-recipes/mealie
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, sso: true }
  oidc: { redirect: /login }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ADMIN_EMAIL
      type: email
      title: Admin e-mail
      description: "You sign in to Mealie with it. Mealie's default admin (changeme@example.com / MyPassword) gets it once, while that login still works (on the first start); an admin changed earlier stays as it is. Change it later in Mealie."
      required: true
    - name: ADMIN_NAME
      type: string
      title: Admin full name
      description: Set once, like the e-mail.
      default: Admin
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: "At least 8 characters. Set once, like the e-mail, so the default password never stays; change it later in Mealie."
      required: true
      pattern: "^.{8,}$"
    - name: ALLOW_SIGNUP
      type: bool
      title: Let visitors create accounts
      default: "false"
  files:
    - { src: files/setup.py, dest: setup/setup.py }
  volumes:
    - { name: data, backup: true }
