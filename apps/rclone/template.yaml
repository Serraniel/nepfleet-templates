apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: rclone
  title: rclone
  description: rclone with its web GUI, for syncing to cloud storage (e.g. a Hetzner Storage Box). Remotes are set up in the GUI and kept in the config volume. Sign in at https://DOMAIN/login?url=https://DOMAIN/rc/ (the dashboard tile links there); scripts use rclone rc --url https://DOMAIN/rc/.
  tier: app
  category: storage
  homepage: https://rclone.org
  source: https://github.com/rclone/rclone
spec:
  version: 0.3.2
  compose: compose.yaml
  # No spec.web: the GUI calls its API on a second port, so a LAN port alone
  # would not work. The bot check needs one plain route; this has two.
  botCheck: { supported: false, service: rclone, port: 5580 }
  images:
    - name: rclone/rclone
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain for the web GUI
      required: true
    - name: RC_USER
      type: string
      title: Web GUI user
      default: admin
      required: true
    - name: DATA_PATH
      type: path
      title: Host folder rclone may read and write
      required: true
    - name: RC_PASSWORD
      type: secret
      title: Web GUI password
      description: "You sign in to the GUI (as RC_USER) and to the rc API with it. Kept encrypted in the fleet."
      required: true
  volumes:
    - { name: config, backup: true }
