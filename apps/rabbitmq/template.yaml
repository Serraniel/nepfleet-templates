apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: rabbitmq
  title: RabbitMQ
  description: "A message broker for apps and your own services. Its management UI is behind your domain (sign in as admin with the generated ADMIN_PASSWORD: sops decrypt stacks/rabbitmq/values.secret.yaml). Services on the ingress network reach AMQP at rabbitmq:5672; it is also published on this host's loopback, or on the LAN when you set AMQP_BIND to 0.0.0.0. Not for Swarm yet: swarm publishes ports on every address, so the loopback default can't hold there."
  tier: app
  category: development
  homepage: https://www.rabbitmq.com
  source: https://github.com/rabbitmq/rabbitmq-server
spec:
  version: 0.1.0
  compose: compose.yaml
  web: { service: rabbitmq, port: 15672 }   # the management UI; also reachable on a LAN port (access mode port)
  botCheck: { allow: ["^/api/"] }   # the management HTTP API, used by tools with credentials
  images:
    - name: rabbitmq
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, autoUpdate: true, backup: true, metrics: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: AMQP_BIND
      type: string
      title: Address AMQP is published on (127.0.0.1 = this host only; 0.0.0.0 = the LAN too)
      description: "Services on the ingress network reach it at rabbitmq:5672 either way. On the LAN, clients need the admin or their own credentials."
      default: "127.0.0.1"
      required: true
      pattern: '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'
    - name: AMQP_PORT
      type: int
      title: Host port for AMQP
      default: "5672"
      required: true
  generate:
    - { name: ADMIN_PASSWORD, kind: secret, length: 24, encoding: alnum }
  volumes:
    - { name: data, backup: true }   # queues, messages, users
