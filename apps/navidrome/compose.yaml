services:
  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    environment:
      ND_BASEURL: ${NEPFLEET_URL}
      ND_SCANSCHEDULE: ${SCAN_SCHEDULE}
      ND_LOGLEVEL: info
      ND_ENABLEINSIGHTSCOLLECTOR: "false"   # no anonymous usage reports
    volumes:
      - data:/data
      - ${MUSIC_PATH}:/music:ro
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 4533}}"
      kuma.navidrome.http.name: Navidrome
      kuma.navidrome.http.url: ${NEPFLEET_URL}/ping
      homepage.group: Media
      homepage.name: Navidrome
      homepage.icon: navidrome.svg
      homepage.href: ${NEPFLEET_URL}

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
