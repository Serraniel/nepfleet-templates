services:
  imgproxy:
    image: darthsim/imgproxy:v4.0.24
    restart: unless-stopped
    read_only: true
    environment:
      IMGPROXY_BIND: ":8080"
      # Signed URLs only: without key and salt it would resize anything for anyone.
      IMGPROXY_KEY: ${KEY}
      IMGPROXY_SALT: ${SALT}
      IMGPROXY_ALLOWED_SOURCES: ${ALLOWED_SOURCES}
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      TZ: ${TZ}
    networks:
      ingress:
        aliases: [imgproxy]
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      start_period: 10s
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8080}}"
      kuma.imgproxy.http.name: imgproxy
      kuma.imgproxy.http.url: ${NEPFLEET_URL}/health

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
