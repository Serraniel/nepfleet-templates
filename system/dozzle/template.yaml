apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: dozzle
  title: Dozzle
  description: Live container logs in the browser, behind a sign-in (the admin user and password set here). Deploy on swarm for a fleet-wide view.
  tier: system
  category: monitoring
  homepage: https://dozzle.dev
  source: https://github.com/amir20/dozzle
spec:
  version: 0.5.4
  compose: compose.yaml
  images:
    - name: amir20/dozzle
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, autoUpdate: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: DOZZLE_USERNAME
      type: string
      title: Admin user
      description: Sign in to Dozzle with it.
      default: admin
      required: true
      pattern: "^[a-z][a-z0-9_.-]{0,31}$"
    - name: DOZZLE_PASSWORD
      type: secret
      title: Admin password
      description: Kept encrypted in the fleet; Dozzle gets only its bcrypt hash. To change it, set a new one in the stack's secrets and apply.
      required: true
    - name: ALERTS_API_URL
      type: url
      title: NepFleet's API for log alerts (override)
      description: "Leave empty: NepFleet connects Dozzle to its own API. Log lines with fatal, panic or out of memory go there and on to the fleet's notification channels, deduplicated. Set it only to send alerts to another NepFleet, e.g. https://fleet.example.org."
    - name: ALERTS_TOKEN
      type: secret
      title: API token for alerts (override)
      description: "Leave empty: NepFleet makes a notify token for this stack (listed on Access as stack:dozzle/…). Set it only with an override URL: nepfleet token create --name dozzle --scope notify --expires 365d"
  files:
    - { src: files/users.yml, dest: data/users.yml }
    - { src: files/notifications.yml, dest: data/notifications.yml }
  generate:
    # Dozzle takes the password as a bcrypt hash (users.yml).
    - name: DOZZLE_PASSWORD_HASH
      kind: bcrypt
      from: DOZZLE_PASSWORD
    - name: ALERTS_NOTIFY_TOKEN
      kind: notify-token
