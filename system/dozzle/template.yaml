apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: dozzle
  title: Dozzle
  description: Live container logs in the browser. Deploy on swarm for a fleet-wide view.
  tier: system
  category: monitoring
  homepage: https://dozzle.dev
  source: https://github.com/amir20/dozzle
spec:
  version: 0.4.0
  compose: compose.yaml
  images:
    - name: amir20/dozzle
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, autoUpdate: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ALERTS_API_URL
      type: url
      title: NepFleet's API, for log alerts
      description: "Log lines with fatal, panic or out of memory go to its /api/v1/alerts, and from there to the fleet's notification channels, deduplicated. For example https://fleet.example.org. Leave empty for no alerts."
    - name: ALERTS_TOKEN
      type: secret
      title: API token for alerts
      description: "A notify token, which only sends alerts: nepfleet token create --name dozzle --scope notify --expires 365d"
  files:
    - { src: files/users.yml, dest: data/users.yml }
    - { src: files/notifications.yml, dest: data/notifications.yml }
  generate: []
