apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: dozzle
  title: Dozzle
  description: Live container logs in the browser. Deploy on swarm for a fleet-wide view.
  tier: system
  category: monitoring
  homepage: https://dozzle.dev
  source: https://github.com/amir20/dozzle
spec:
  version: 0.3.0
  compose: compose.yaml
  images:
    - name: amir20/dozzle
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, dashboard: true, autoUpdate: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: ALERT_WEBHOOK_URL
      type: secret
      title: Webhook for log alerts
      description: "Log lines with fatal, panic or out of memory are sent here, as Dozzle's JSON. Every matching line sends one, with no limit, so use a receiver that copes. Leave empty for no alerts."
  files:
    - { src: files/users.yml, dest: data/users.yml }
    - { src: files/notifications.yml, dest: data/notifications.yml }
  generate: []
