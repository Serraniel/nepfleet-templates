[sshd]
enabled = true
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service + _SYSTEMD_UNIT=sshd.service
# INPUT: SSH is on the host. Traffic to Docker's published ports never passes
# here, so a jail for those needs chain = DOCKER-USER.
chain = INPUT
ignoreip = ${IGNORE_IP}
maxretry = ${MAX_RETRY}
findtime = ${FIND_TIME}
bantime = ${BAN_TIME}
