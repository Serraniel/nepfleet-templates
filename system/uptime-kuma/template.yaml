apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: uptime-kuma
  title: Uptime Kuma + AutoKuma
  description: Uptime monitoring and status pages. AutoKuma creates monitors from kuma.* labels. Install it once for the whole fleet, or once per stack for a stack-local status page.
  tier: system
  category: monitoring
  homepage: https://github.com/louislam/uptime-kuma
spec:
  version: 0.6.0
  compose: compose.yaml
  images:
    - name: louislam/uptime-kuma
      track: minor
    - name: ghcr.io/bigboot/autokuma
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { swarm: true, arm64: true, ingress: true, monitoring: true, statusPage: true, dashboard: true, autoUpdate: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: KUMA_USERNAME
      type: string
      title: Admin user
      description: Created on Kuma's first start, so its setup screen is never open; sign in with it, and AutoKuma does too. Kuma's admin gets this name on every start, also an admin made by hand in Kuma.
      default: admin
      required: true
    - name: KUMA_PASSWORD
      type: secret
      title: Admin password
      description: At least 6 characters, from at least two of lowercase, uppercase, digits and symbols (Kuma refuses weaker ones). Kuma's admin gets it on every start, so a change here, or one made in Kuma, ends up as this password and AutoKuma can still sign in.
      pattern: "^.{6,}$"
      required: true
  generate:
    # Kuma's alerts go to NepFleet's alerts API with this token.
    - name: NOTIFY_TOKEN
      kind: notify-token
  files:
    - { src: files/setup.js, dest: setup/setup.js }
    - { src: files/prestart.js, dest: setup/prestart.js }
  volumes:
    - name: data
      backup: true
    # Which Kuma monitors AutoKuma made; without it every restart makes them again.
    - name: autokuma
      backup: true
