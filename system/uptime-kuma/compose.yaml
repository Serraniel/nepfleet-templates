services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - data:/app/data
    networks: [ingress, default]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3001}}"
      homepage.group: System
      homepage.name: Uptime
      homepage.icon: uptime-kuma.svg
      homepage.href: https://${DOMAIN}

  autokuma:
    image: ghcr.io/bigboot/autokuma:2
    restart: unless-stopped
    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${KUMA_USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${KUMA_PASSWORD}
      AUTOKUMA__DOCKER__HOSTS: tcp://socket-proxy:2375
      AUTOKUMA__DOCKER__LABEL_PREFIX: kuma
    networks: [default, socket]
    depends_on: [uptime-kuma, socket-proxy]

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      SERVICES: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

volumes:
  data:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
  socket:
    internal: true
