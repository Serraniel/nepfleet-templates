services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - data:/app/data
    # socket: Docker monitors (workers, databases) ask the read-only proxy
    # whether a container runs and is healthy.
    # nepfleet-api: alerts go to NepFleet (the notification below).
    networks: [ingress, default, socket, nepfleet-api]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3001}}"
      homepage.group: System
      homepage.name: Uptime
      homepage.description: Uptime monitors and status
      homepage.icon: uptime-kuma.svg
      homepage.href: ${NEPFLEET_URL}

  # Creates the admin on the first start (setup.js), then exits; later runs
  # find it and do nothing.
  setup:
    image: louislam/uptime-kuma:2
    restart: "no"
    entrypoint: ["node", "/setup/setup.js"]
    environment:
      NODE_PATH: /app/node_modules
      KUMA_USERNAME: ${KUMA_USERNAME}
      KUMA_PASSWORD: ${KUMA_PASSWORD}
    volumes:
      - ./setup:/setup:ro
    networks: [default]
    depends_on:
      uptime-kuma: { condition: service_healthy }

  autokuma:
    image: ghcr.io/bigboot/autokuma:2
    restart: unless-stopped
    environment:
      AUTOKUMA__KUMA__URL: http://uptime-kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${KUMA_USERNAME}
      AUTOKUMA__KUMA__PASSWORD: ${KUMA_PASSWORD}
      AUTOKUMA__DOCKER__HOSTS: tcp://socket-proxy:2375
      AUTOKUMA__DOCKER__LABEL_PREFIX: kuma
      # Every monitor alerts through NepFleet, whose channels deliver.
      AUTOKUMA__DEFAULT_SETTINGS: '*.notification_name_list: ["nepfleet"]'
    networks: [default, socket]
    depends_on:
      uptime-kuma: { condition: service_started }
      socket-proxy: { condition: service_started }
      # Compose only accepts a one-shot that exits when something waits for it.
      setup: { condition: service_completed_successfully }
    labels:
      # The Docker host that templates' docker monitors name with
      # docker_host_name: nepfleet-docker.
      kuma.nepfleet-docker.docker_host.name: Docker (NepFleet)
      kuma.nepfleet-docker.docker_host.connection_type: tcp
      kuma.nepfleet-docker.docker_host.host: http://socket-proxy:2375
      # Down and up alerts go to NepFleet's alerts API with this stack's
      # token, and from there to the fleet's notification channels. raw:
      # the {{ }} are Kuma's (Liquid), not AutoKuma's (Tera).
      kuma.nepfleet.notification.name: NepFleet
      kuma.nepfleet.notification.active: "true"
      kuma.nepfleet.notification.config: '{"type": "webhook", "webhookURL": "${NEPFLEET_API_URL}/api/v1/alerts", "webhookContentType": "custom", "webhookCustomBody": "{\"source\": \"uptime-kuma\", \"rule\": {% raw %}{{ name | json }}{% endraw %}, \"detail\": {% raw %}{{ msg | json }}{% endraw %}}", "webhookAdditionalHeaders": "{\"Authorization\": \"Bearer ${NOTIFY_TOKEN}\", \"Content-Type\": \"application/json\"}"}'

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      SERVICES: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

volumes:
  data:

networks:
  default:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
  socket:
    internal: true
  # Reaches NepFleet's API (as nepfleet), and nothing else.
  nepfleet-api:
    name: ${NEPFLEET_API_NETWORK}
    external: true
