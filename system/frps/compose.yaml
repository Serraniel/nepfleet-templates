services:
  frps:
    image: fatedier/frps:v0.72.0
    restart: unless-stopped
    command: ["-c", "/etc/frp/frps.toml"]
    environment:
      FRP_TOKEN: ${FRP_TOKEN}
    ports:
      - "${BIND_ADDR}:7000:7000"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    networks: [ingress]
    labels:
      caddy: ${EXPOSED_HOSTS}
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
