apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: loki
  title: Loki
  description: "Keeps every container's logs on this host, searchable in Grafana by stack and service. Alloy collects them through a read-only Docker proxy. In Grafana, add a Loki data source at http://<stack>-loki-1:3100. Some apps log tokens or personal data, so treat the logs like the apps' own data. No usage reports go to Grafana Labs."
  tier: system
  category: monitoring
  homepage: https://grafana.com/oss/loki/
  source: https://github.com/grafana/loki
spec:
  version: 0.1.0
  compose: compose.yaml
  images:
    - name: grafana/loki
      track: minor
    - name: grafana/alloy
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { arm64: true, monitoring: true, logs: true, autoUpdate: true, backup: true, metrics: true }
  inputs:
    - name: RETENTION
      type: string
      title: Keep logs for
      default: 14d
      required: true
      pattern: '^[0-9]+[hdw]$'
  files:
    - { src: files/loki.yaml, dest: loki.yaml }
    - { src: files/config.alloy, dest: config.alloy }
  volumes:
    - { name: data, backup: true }
    - { name: alloy, backup: false }
