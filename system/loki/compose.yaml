services:
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - data:/loki
    # Grafana reaches it on the ingress network; nothing is published.
    networks: [ingress, default]
    labels:
      nepfleet.metrics.port: "3100"
      # Running (Docker monitor; no credentials needed).
      kuma.loki.docker.name: Loki
      kuma.loki.docker.docker_container: ${NEPFLEET_STACK}-loki-1
      kuma.loki.docker.docker_host_name: nepfleet-docker

  # Collects the logs. No usage reports to Grafana Labs.
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--disable-reporting"]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy:/var/lib/alloy/data
    networks: [default, socket]
    depends_on: [loki, socket-proxy]
    labels:
      kuma.loki-alloy.docker.name: Loki's log collector
      kuma.loki-alloy.docker.docker_container: ${NEPFLEET_STACK}-alloy-1
      kuma.loki-alloy.docker.docker_host_name: nepfleet-docker

  # Read-only API: container lists, logs and events. No starting, stopping or exec.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      ALLOW_LOGS: 1
      EVENTS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

volumes:
  data:
  alloy:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
  socket:
    internal: true
