apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: neptide
  title: neptide image updates
  description: Health-gated image updates with automatic rollback, for containers and swarm services labelled neptide.enable=true.
  tier: system
  category: updates
  homepage: https://github.com/Serraniel/neptide
spec:
  version: 0.2.0
  compose: compose.yaml
  images:
    - name: ghcr.io/serraniel/neptide
      track: patch   # pre-1.0
  supports: { swarm: true, arm64: true, logs: true, autoUpdate: true }
  inputs:
    - name: DOCKER_GID
      type: int
      title: Docker group ID (override)
      description: "Leave empty: NepFleet fills in the host's docker group. Set it only if neptide can't reach Docker (getent group docker | cut -d: -f3 on the host)."
    - name: MONITOR_ONLY
      type: bool
      title: Only notify, never update
      default: "false"
    - name: NOTIFY
      type: secret
      title: Notification URLs (override)
      description: "Leave empty: notifications go to NepFleet, which sends them to the fleet's notification channels. Set comma separated shoutrrr URLs (e.g. discord://token@webhookid) only to send somewhere else instead."
  generate:
    # Sends to NepFleet's alerts API, whose channels deliver (see the URL input).
    - name: NOTIFY_TOKEN
      kind: notify-token
