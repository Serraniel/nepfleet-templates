global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Every service with a nepfleet.metrics.port label, on the ingress network.
  - job_name: nepfleet
    docker_sd_configs:
      - host: tcp://socket-proxy:2375
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_nepfleet_metrics_port]
        regex: .+
        action: keep
      - source_labels: [__meta_docker_network_name]
        regex: ${NEPFLEET_INGRESS_NETWORK}
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_nepfleet_metrics_port]
        regex: (.+);(.+)
        replacement: "$1:$2"
        target_label: __address__
      - source_labels: [__meta_docker_container_label_nepfleet_metrics_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__meta_docker_container_label_nepfleet_metrics_scheme]
        regex: (.+)
        target_label: __scheme__
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: stack
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
