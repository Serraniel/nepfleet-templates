apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: watchtower
  title: Watchtower (maintained fork)
  description: Image update notifications for containers NepFleet does not manage. Monitor-only by default, because in-place updates bypass the fleet repository and cannot be rolled back.
  tier: system
  category: updates
  homepage: https://github.com/nicholas-fedor/watchtower
spec:
  version: 0.2.1
  compose: compose.yaml
  images:
    - name: nickfedor/watchtower
      track: minor
  supports: { arm64: true, logs: true, autoUpdate: true }
  inputs:
    - name: WATCHTOWER_MODE
      type: enum
      title: Mode
      options: ["true", "false"]
      default: "true"
      description: '"true" = monitor only (notify). "false" = update labelled containers in place.'
    - name: NOTIFICATION_URL
      type: secret
      title: Notification URL (override)
      description: "Leave empty: notifications go to NepFleet, which sends them to the fleet's notification channels. Set a shoutrrr URL (e.g. ntfy://ntfy.sh/my-topic) only to send somewhere else instead."
    - name: SCHEDULE
      type: string
      title: Schedule (6-field cron)
      default: "0 0 4 * * *"
      required: true
  generate:
    # Sends to NepFleet's alerts API, whose channels deliver (see the URL input).
    - name: NOTIFY_TOKEN
      kind: notify-token
