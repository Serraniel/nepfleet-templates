apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: grafana
  title: Grafana
  description: "Metrics dashboards, reading the prometheus template's data. Sign in as admin, with the password in the stack's encrypted secrets (ADMIN_PASSWORD)."
  tier: system
  category: monitoring
  homepage: https://grafana.com/oss/grafana
  source: https://github.com/grafana/grafana
spec:
  version: 0.2.0
  compose: compose.yaml
  web: { service: grafana, port: 3000 }
  images:
    - name: grafana/grafana
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, backup: true, metrics: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain
      required: true
    - name: PROMETHEUS_URL
      type: url
      title: Prometheus address
      description: The prometheus template's address on the ingress network.
      default: http://prometheus:9090
    - name: LOKI_URL
      type: url
      title: Loki address
      description: The loki template's address on the ingress network, for logs.
      default: http://loki:3100
  generate:
    - { name: ADMIN_PASSWORD, kind: secret, length: 32, encoding: alnum }
  files:
    - { src: files/datasources.yaml, dest: provisioning/datasources.yaml }
  volumes:
    - { name: data, backup: true }
