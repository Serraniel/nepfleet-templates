apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: caddy
  title: Caddy ingress
  description: Reverse proxy with automatic TLS. Routes are read from caddy.* labels, and DNS-01 gives trusted certificates on home networks too.
  tier: system
  category: networking
  homepage: https://github.com/lucaslorentz/caddy-docker-proxy
  source: https://github.com/Serraniel/nepfleet-templates/tree/main/images/caddy
spec:
  version: 0.3.1
  compose: compose.yaml
  images:
    - name: ghcr.io/serraniel/nepfleet-caddy
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { swarm: true, arm64: true, logs: true, autoUpdate: true, backup: true }
  inputs:
    - name: ACME_EMAIL
      type: email
      title: E-mail for Let's Encrypt
      required: true
    - name: CADDY_DNS_PROVIDER
      type: enum
      title: DNS provider for DNS-01
      description: Needed for trusted certificates on names that are not reachable from the internet (home network) and for wildcards.
      options: [none, cloudflare, hetzner, desec]
      default: none
    - name: DNS_API_TOKEN
      type: secret
      title: DNS provider API token
      description: "Not needed without a DNS provider. Details per provider: nepfleet docs/home-tls.md."
      helpFrom: CADDY_DNS_PROVIDER
      help:
        cloudflare: "Cloudflare → My Profile → API Tokens → Create Token. Permissions: Zone → Zone → Read and Zone → DNS → Edit. Zone Resources: Include → Specific zone → your zone. That also covers the sites' records when \"Create the sites' DNS records\" is on."
        hetzner: "Hetzner Console → your project → Security → API tokens → Generate, with Read & Write. Put the DNS zone in a project of its own: the token reaches everything in its project."
        desec: "deSEC → Token management → a new token without \"Can manage tokens\". For certificates alone, a policy that allows only TXT records is enough; with \"Create the sites' DNS records\" on, also allow A and AAAA."
    - name: DNS_RECORDS
      type: enum
      title: Create the sites' DNS records
      description: "With on, Caddy keeps an A record (and AAAA, with IPv6) for each of its sites under the DNS zone pointed at this host's public address, through the DNS provider and its token (which then needs DNS edit on the zone, as for certificates). It checks every 5 minutes, finds the address by asking public what-is-my-IP services, and sets records that point elsewhere to this host. It never touches the zone's apex, and never deletes records. Works with every DNS provider here. Single hosts only: in Swarm, leave it off (replicas would overwrite each other's records)."
      options: ["off", "on"]
      default: "off"
    - name: DNS_ZONE
      type: string
      title: DNS zone for the records
      description: "The domain the DNS provider holds, e.g. example.org: sites under it (status.vps.example.org) get records. Used when DNS records are on."
      default: example.org
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    - name: WILDCARD
      type: enum
      title: One wildcard certificate for a home domain
      description: "Every certificate is published in Certificate Transparency logs, so one per name lists what runs at home publicly. With on, names under the wildcard domain share one certificate. Needs a DNS provider."
      options: ["off", "on"]
      default: "off"
    - name: WILDCARD_DOMAIN
      type: string
      title: Wildcard domain
      description: "For example home.example.org: covers jellyfin.home.example.org, but not deeper names. Used when the wildcard is on."
      default: home.example.org
      pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
  volumes:
    - name: data
      backup: true
      shared: true
  files:
    - { src: files/Caddyfile, dest: Caddyfile }
    - { src: files/dns/none.caddy, dest: dns/none.caddy }
    - { src: files/dns/cloudflare.caddy, dest: dns/cloudflare.caddy }
    - { src: files/dns/hetzner.caddy, dest: dns/hetzner.caddy }
    - { src: files/dns/desec.caddy, dest: dns/desec.caddy }
    - { src: files/records/off-none.caddy, dest: records/off-none.caddy }
    - { src: files/records/off-cloudflare.caddy, dest: records/off-cloudflare.caddy }
    - { src: files/records/off-hetzner.caddy, dest: records/off-hetzner.caddy }
    - { src: files/records/off-desec.caddy, dest: records/off-desec.caddy }
    - { src: files/records/on-none.caddy, dest: records/on-none.caddy }
    - { src: files/records/on-cloudflare.caddy, dest: records/on-cloudflare.caddy }
    - { src: files/records/on-hetzner.caddy, dest: records/on-hetzner.caddy }
    - { src: files/records/on-desec.caddy, dest: records/on-desec.caddy }
    - { src: files/wildcard/off-site.caddy, dest: wildcard/off-site.caddy }
    - { src: files/wildcard/on-site.caddy, dest: wildcard/on-site.caddy }
