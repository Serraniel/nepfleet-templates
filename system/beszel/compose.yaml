services:
  beszel:
    image: henrygd/beszel:0.21.2
    restart: unless-stopped
    environment:
      APP_URL: ${NEPFLEET_URL}
      # The admin from the stack's inputs, made on the first start: no
      # account screen for whoever opens the domain first.
      BESZEL_HUB_USER_EMAIL: ${ADMIN_EMAIL}
      BESZEL_HUB_USER_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - data:/beszel_data
    # default: the pair service reaches it by name there, not on the shared
    # ingress network.
    networks: [default, ingress]
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8090}}"
      kuma.beszel.http.name: Beszel
      kuma.beszel.http.url: ${NEPFLEET_URL}/api/health
      homepage.group: System
      homepage.name: Beszel
      homepage.description: Host and container metrics
      homepage.icon: beszel.svg
      homepage.href: ${NEPFLEET_URL}
    deploy:
      replicas: 1   # SQLite: never more than one
      update_config: { order: stop-first }

  # Sets up what agents pair with (files/pair.sh): the universal token and a
  # read-only user for the hub's public key. Beszel's image has no shell.
  pair:
    image: curlimages/curl:8.23.0
    restart: "no"
    entrypoint: ["/bin/sh", "/pair/pair.sh"]
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AGENT_TOKEN: ${AGENT_TOKEN}
      PAIR_PASSWORD: ${PAIR_PASSWORD}
    volumes:
      - ./pair:/pair:ro
    networks: [default]
    depends_on:
      beszel: { condition: service_healthy }

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
