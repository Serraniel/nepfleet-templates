services:
  backup:
    image: offen/docker-volume-backup:v2.50.1
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: ${SCHEDULE}
      BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: backup-
      BACKUP_RETENTION_DAYS: ${RETENTION_DAYS}
      # Encrypted to the fleet's age recipients (fleet.yaml): without the
      # fleet key, a stolen archive is useless.
      AGE_PUBLIC_KEYS: ${NEPFLEET_AGE_RECIPIENTS}
      SSH_HOST_NAME: ${SSH_HOST_NAME}
      SSH_PORT: ${SSH_PORT}
      SSH_USER: ${SSH_USER}
      SSH_PASSWORD: ${SSH_PASSWORD}
      SSH_REMOTE_PATH: ${SSH_REMOTE_PATH}
      SSH_HOST_PUBLIC_KEY: ${SSH_HOST_PUBLIC_KEY}   # without it, the SSH copy refuses to connect
      # Your exclude, plus every volume a template on this host marks
      # backup: false (caches, models); NepFleet lists those by name.
      # Safety copies left by nepfleet restore (<volume>-before-restore-<time>)
      # are not backed up either.
      BACKUP_EXCLUDE_REGEXP: ${EXCLUDE_REGEXP}|/backup/volumes/(${NEPFLEET_NO_BACKUP_VOLUMES})/|/backup/volumes/[^/]+-before-restore-[0-9-]+/
      # The person's URLs, else NepFleet's alerts API with this stack's token.
      NOTIFICATION_URLS: ${NOTIFICATION_URLS:-generic://${NEPFLEET_API_HOST}/api/v1/alerts?disabletls=yes&template=json&@Authorization=Bearer%20${NOTIFY_TOKEN}}
      NOTIFICATION_LEVEL: error
      DOCKER_HOST: tcp://socket-proxy:2375
      TZ: ${TZ}
    volumes:
      - /var/lib/docker/volumes:/backup/volumes:ro
      - ${ARCHIVE_PATH}:/archive
    networks: [socket, default, nepfleet-api]
    depends_on: [socket-proxy]

  # Exactly what stop-during-backup needs: list containers, read /info
  # (swarm detection), start and stop. No POST: it would allow creating
  # (privileged) containers, which is root on the host.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.8
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      INFO: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

networks:
  default:
  socket:
    internal: true
  # Reaches NepFleet's API (as nepfleet), and nothing else.
  nepfleet-api:
    name: ${NEPFLEET_API_NETWORK}
    external: true
