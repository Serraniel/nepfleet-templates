services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN}
    volumes:
      - ./config:/app/config
    networks: [ingress, socket]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      kuma.homepage.http.name: Homepage
      kuma.homepage.http.url: https://${DOMAIN}

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
  socket:
    internal: true
