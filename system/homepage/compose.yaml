services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN}
    volumes:
      - ./config:/app/config
    networks: [ingress, socket]
    labels:
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      kuma.homepage.http.name: Homepage
      kuma.homepage.http.url: ${NEPFLEET_URL}

  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.8
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      # Swarm: the services' labels, and their tasks for the status dots.
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    deploy:
      # On swarm: only a manager lists the services.
      placement:
        constraints: [node.role == manager]

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
  socket:
    internal: true
