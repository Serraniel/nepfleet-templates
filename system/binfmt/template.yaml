apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: binfmt
  title: Foreign-architecture emulation
  description: Registers QEMU user-mode emulators, so images built for another CPU (e.g. amd64 on an arm64 host) can run, slower. Registrations do not survive a reboot, so nepfleet serve starts this stack again when it starts and the emulators are missing (NepFleet 0.2 or later). Privileged.
  tier: system
  category: host
  homepage: https://github.com/tonistiigi/binfmt
spec:
  version: 0.1.1
  compose: compose.yaml
  images:
    - name: tonistiigi/binfmt
      track: minor
  supports: { swarm: false, arm64: true }
  inputs:
    - name: ARCHES
      type: string
      title: Architectures to emulate
      default: amd64,arm64
      pattern: "^[a-z0-9,]+$"
      required: true
