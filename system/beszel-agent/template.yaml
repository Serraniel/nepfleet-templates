apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: beszel-agent
  title: Beszel agent
  description: "Sends this host's and its containers' metrics to a Beszel hub. In the hub, Add System with the WebSocket option gives the key and token. It connects out to the hub and opens no port, and reads Docker through a read-only proxy. Network traffic is the container's own, not the host's."
  tier: system
  category: monitoring
  homepage: https://beszel.dev
  source: https://github.com/henrygd/beszel
spec:
  version: 0.1.0
  compose: compose.yaml
  images:
    - name: henrygd/beszel-agent
      track: minor
    - name: lscr.io/linuxserver/socket-proxy
      track: minor
  supports: { arm64: true, monitoring: true, logs: true, autoUpdate: true }
  inputs:
    - name: HUB_URL
      type: url
      title: The hub's address
      required: true
    - name: KEY
      type: string
      title: The hub's public key (from Add System)
      required: true
      pattern: '^ssh-ed25519 [A-Za-z0-9+/=]+$'
    - name: TOKEN
      type: secret
      title: The token from Add System
      required: true
  volumes:
    - { name: data, backup: false }
