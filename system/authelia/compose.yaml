services:
  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template   # the mail settings below pick the notifier
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER: ${SMTP_SENDER}
      # Unused by Authelia: a new password changes it, which recreates the
      # container, so Authelia reads the new users.yml.
      X_ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    volumes:
      - data:/data
      - ./config/configuration.yml:/config/configuration.yml:ro
      - ./config/users.yml:/config/users.yml:ro
    networks: [ingress]
    labels:
      docker-volume-backup.stop-during-backup: "true"   # consistent database copy
      caddy: ${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 9091}}"
      kuma.authelia.http.name: Authelia
      kuma.authelia.http.url: ${NEPFLEET_URL}/api/health
      homepage.group: Security
      homepage.name: Authelia
      homepage.description: Sign-in and two-factor
      homepage.icon: authelia.svg
      homepage.href: ${NEPFLEET_URL}

  # Prints what Authelia would mail (the one-time code to register a second
  # factor) to the stack's logs, when no mail server is set. The file stays in
  # the data volume; Authelia can't write to its own output, as it syncs the file.
  notifications:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    entrypoint: ["tail", "-n", "0", "-F", "/data/notifications.txt"]
    volumes:
      - data:/data:ro
    network_mode: none

volumes:
  data:

networks:
  ingress:
    name: ${NEPFLEET_INGRESS_NETWORK}
    external: true
