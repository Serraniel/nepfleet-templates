apiVersion: nepfleet/v1alpha1
kind: Template
metadata:
  name: authelia
  title: Authelia
  description: "Sign-in with a second factor, in front of apps with no login of their own. Needs HTTPS and a domain. Sign in with the admin from the inputs, then register a second factor: the one-time code it asks for comes by mail when a mail server is set, else it shows in the stack's logs (the notifications service). To protect an app, add Caddy's forward_auth to it, as Authelia's Caddy guide shows."
  tier: system
  category: security
  homepage: https://www.authelia.com
  source: https://github.com/authelia/authelia
spec:
  version: 0.2.0
  compose: compose.yaml
  images:
    - name: authelia/authelia
      track: minor
  supports: { arm64: true, ingress: true, monitoring: true, dashboard: true, logs: true, backup: true }
  inputs:
    - name: DOMAIN
      type: hostname
      title: Domain of its sign-in page, e.g. auth.example.org
      required: true
    - name: COOKIE_DOMAIN
      type: hostname
      title: Domain to protect, e.g. example.org
      description: Must contain the domain above. Apps under it share the sign-in.
      required: true
    - name: ADMIN_USER
      type: string
      title: Admin user name
      default: admin
      required: true
      pattern: '^[a-z0-9_.-]+$'
    - name: ADMIN_EMAIL
      type: email
      title: Admin email
      required: true
    - name: ADMIN_PASSWORD
      type: secret
      title: Admin password
      description: The admin signs in with it. Authelia gets only its hash. Changing it here changes it on the next apply.
      required: true
    - name: SMTP_ADDRESS
      type: string
      title: Mail server, e.g. submission://smtp.example.org:587
      description: "Optional. submission:// for STARTTLS (port 587), submissions:// for TLS (port 465). Without one, the one-time codes show in the stack's logs."
    - name: SMTP_USERNAME
      type: string
      title: Mail login
    - name: SMTP_PASSWORD
      type: secret
      title: Mail password
    - name: SMTP_SENDER
      type: string
      title: Mail from, e.g. Authelia <auth@example.org>
      description: By default noreply at the protected domain.
  generate:
    - { name: JWT_SECRET, kind: secret, length: 64, encoding: alnum }
    - { name: SESSION_SECRET, kind: secret, length: 64, encoding: alnum }
    - { name: STORAGE_ENCRYPTION_KEY, kind: secret, length: 64, encoding: alnum }
    - { name: ADMIN_PASSWORD_HASH, kind: bcrypt, from: ADMIN_PASSWORD }
  files:
    - { src: files/configuration.yml, dest: config/configuration.yml }
    - { src: files/users.yml, dest: config/users.yml }
  volumes:
    - { name: data, backup: true }
