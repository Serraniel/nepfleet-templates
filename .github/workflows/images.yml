# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the images NepFleet's system templates need (images/<name>/) and
# publishes them as ghcr.io/<owner>/nepfleet-<name>. Pushes to main publish
# :edge; a weekly run picks up base image fixes.
name: Images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and Caddy version
        id: v
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nepfleet-caddy" >> "$GITHUB_ENV"
          version=$(sed -nE 's/^FROM caddy:([0-9.]+)-alpine.*/\1/p' images/caddy/Dockerfile)
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ steps.v.outputs.full }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.major }}
            ${{ env.IMAGE }}:sha-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.title=NepFleet Caddy
            org.opencontainers.image.description=Caddy with docker-proxy and DNS-01 providers
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      # SPDX SBOM and provenance come from BuildKit; CycloneDX is attested on top.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: image.cdx.json
          upload-release-assets: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image and attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate image.cdx.json "${IMAGE}@${DIGEST}"
      # GHCR creates new packages as private. Templates pull anonymously, so
      # fail here rather than on every user's host.
      - name: Image can be pulled anonymously
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          # A private package refuses even the anonymous token.
          token=$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${DIGEST}")
          [ "$code" = 200 ] || { echo "::error::${IMAGE} is not public (HTTP ${code}). See README: Images."; exit 1; }
