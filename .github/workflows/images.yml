# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the images NepFleet's system templates need (images/<name>/) and
# publishes them as ghcr.io/<owner>/nepfleet-<name>. Pushes to main publish
# :edge; a weekly run picks up base image fixes.
name: Images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and Caddy version
        id: v
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nepfleet-caddy" >> "$GITHUB_ENV"
          version=$(sed -nE 's/^FROM caddy:([0-9.]+)-alpine.*/\1/p' images/caddy/Dockerfile)
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ steps.v.outputs.full }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.major }}
            ${{ env.IMAGE }}:sha-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.title=NepFleet Caddy
            org.opencontainers.image.description=Caddy with docker-proxy and DNS-01 providers
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      # SPDX SBOM and provenance come from BuildKit; CycloneDX is attested on top.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: image.cdx.json
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx --predicate image.cdx.json "${IMAGE}@${DIGEST}"
