#
# Versions the catalogue as a whole. NepFleet pins a template source to a tag,
# so merging the release PR is what makes template changes reach users on the
# stable channel; `ref: main` follows edge.
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
